<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>swath</title>
<style>
  :root { --paper:#0E1312; --panel:#161D1B; --deep:#1E2724; --ink:#E7EBE3; --ink2:#9BA69F;
          --ink3:#74807A; --rule:#29332F; --accent:#56C9B1; --signal:#E0AC55; --alert:#E4826A;
          --mono:ui-monospace,"SFMono-Regular","Cascadia Mono",Menlo,Consolas,monospace; }
  * { box-sizing:border-box; margin:0; }
  html,body { width:1080px; height:1350px; overflow:hidden; background:var(--paper);
              color:var(--ink); font-family:var(--mono); }
  .stage { width:1080px; height:1350px; padding:44px 52px; display:flex; flex-direction:column; }
  .top { display:flex; justify-content:space-between; align-items:baseline; }
  h1 { font-size:42px; font-weight:500; letter-spacing:-.035em; color:var(--accent); }
  .clock { font-size:26px; color:var(--ink3); font-variant-numeric:tabular-nums; }
  .act { margin-top:24px; min-height:118px; }
  .act .n { font-size:15px; letter-spacing:.22em; text-transform:uppercase; color:var(--signal); }
  .act .t { font-size:30px; line-height:1.28; margin-top:9px; max-width:970px; letter-spacing:-.02em; }
  .act .t b { color:var(--accent); font-weight:600; }
  .act .t i { font-style:normal; color:var(--alert); font-weight:600; }
  .lbl { font-size:15px; letter-spacing:.18em; text-transform:uppercase; color:var(--ink3);
         margin:18px 0 8px; }
  canvas { display:block; }
  .stats { margin-top:auto; display:grid; grid-template-columns:repeat(4,1fr); gap:1px;
           background:var(--rule); border:1px solid var(--rule); }
  .stats div { background:var(--paper); padding:13px 18px; }
  .stats dt { font-size:14px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink3); }
  .stats dd { font-size:33px; font-variant-numeric:tabular-nums; letter-spacing:-.02em; margin-top:3px; }
  .foot { margin-top:14px; font-size:14px; color:var(--ink3); line-height:1.5; }
</style></head>
<body><div class="stage">
  <div class="top"><h1 id="h1"></h1><div class="clock" id="clock"></div></div>
  <div class="act"><div class="n" id="actn"></div><div class="t" id="actt"></div></div>
  <div class="lbl" id="l1">the keyspace, weighted by objects</div>
  <canvas id="strip" width="976" height="300"></canvas>
  <div class="lbl">the 64 workers &mdash; colour is which guess they are working inside</div>
  <canvas id="pool" width="976" height="150"></canvas>
  <div class="lbl">what has been listed, over time</div>
  <canvas id="hist" width="976" height="150"></canvas>
  <dl class="stats" id="stats"></dl>
  <div class="foot" id="foot"></div>
</div>
<script>
(function(){
  "use strict";
  var M = /*__MODEL__*/null; if(!M) return;
  var meta=M.meta, F=M.findings, stream=M.stream;
  var K_SEED=0,K_CLAIM=1,K_PAGE=2,K_SPLIT=3,K_OWNER=4,K_DONE=5,K_FAIL=6,K_STEAL=7;
  var LIN=["#E4826A","#56C9B1","#6FBBD0","#BCC076","#7FA8CE"], REST="#4E5C56";
  function lin(r){ var s=M.lineage[r]; return s===undefined?REST:LIN[s]; }
  function fmt(n){ return Math.round(n).toLocaleString("en-US"); }
  function secs(ms){ return ms>=60000 ? Math.floor(ms/60000)+"m"+String(Math.round(ms%60000/1000)).padStart(2,"0")+"s"
                                      : (ms/1000).toFixed(1)+"s"; }
  document.getElementById("h1").textContent = meta.title||"swath";
  var D=meta.durationMs, firstSteal=F.firstStealMs===null?D*0.35:F.firstStealMs;

  var ACTS=[
    {at:0,n:"the guess",t:"One request asks S3 where the directories are. swath cuts the keyspace "+
      "into <b>"+fmt(F.seedCount)+" ranges</b> on that answer alone."},
    {at:Math.min(D*0.05,2500),n:"in parallel",t:"<b>"+fmt(meta.workers)+" workers</b> start draining "+
      "their own slices at once. Each bar fills left to right as its worker lists."},
    {at:firstSteal*0.5,n:"unequal",t:"A directory name says nothing about how many objects are "+
      "behind it. The small guesses are already finishing. One is barely moving."},
    {at:firstSteal,n:"the guesses run out",t:"The easy ranges are done and their workers go idle — "+
      "while <i>"+F.topShare+"% of the bucket</i> is still sitting behind a single guess."},
    {at:firstSteal+(D-firstSteal)*0.22,n:"stealing",t:"Idle workers cut the survivor apart at "+
      "boundaries they <b>invent</b> — a key that does not exist is still a valid fence."},
    {at:firstSteal+(D-firstSteal)*0.6,n:"converging",t:"<b>"+fmt(F.topSplits)+" splits</b> later, all "+
      "<b>"+fmt(F.topWorkers)+"</b> workers are inside what began as one range."},
    {at:D*0.985,n:"done",t:"<b>"+fmt(meta.totalKeys)+" objects</b> in "+secs(D)+", at <b>"+
      F.reqPer1k.toFixed(2)+"</b> requests per thousand. No gaps. No overlaps."}
  ];

  var sc=document.getElementById("strip").getContext("2d");
  var pc=document.getElementById("pool").getContext("2d");
  var hc=document.getElementById("hist").getContext("2d");
  var SW=976, SH=300, PH=150, HH=150;
  var stats=document.getElementById("stats"), dds=[];
  [["objects"],["requests"],["live ranges"],["splits"]].forEach(function(l){
    var d=document.createElement("div"),dt=document.createElement("dt"),dd=document.createElement("dd");
    dt.textContent=l[0]; dd.textContent="0"; d.appendChild(dt); d.appendChild(dd);
    stats.appendChild(d); dds.push(dd); });
  document.getElementById("foot").textContent =
    "Generated from this run's own --trace event log by tools/explainer/explainer.py. Horizontal = "+
    "keyspace weighted by objects, so equal width is equal objects. Colour = which original guess "+
    "the work descends from.";

  // Prefix labels, drawn over the span their own objects occupy.
  var FAMS=(M.families||[]).filter(function(f){ return f.x1-f.x0 > 0.05; }).slice(0,6);
  // Every seed cut point, and the real prefix of the heaviest few — these are the boundaries
  // the one delimiter=/ request bought, so they deserve to be visible as themselves.
  var CUTS=[]; for(var q=0;q<stream.length;q++){ if(stream[q][1]===K_SEED) CUTS.push(stream[q][3]); }
  var NAMED=(M.seeds||[]).filter(function(x){ return x.lo && x.x1-x.x0 > 0.06; }).slice(0,5);

  function seek(t){
    var nodes={}, busy={}, keys=0, pages=0, splits=0, steals=0, marks=[], i;
    for(i=0;i<stream.length;i++){
      var e=stream[i]; if(e[0]>t) break;
      var k=e[1], n;
      if(k===K_SEED){ nodes[e[2]]={lo:e[3],hi:e[4],cur:e[3],root:e[2],st:0,w:-1}; }
      else if(k===K_CLAIM){ n=nodes[e[2]]||(nodes[e[2]]={});
        n.lo=e[4]; n.hi=e[6]; n.cur=e[5]; n.root=e[7]; n.st=1; n.w=e[3]; busy[e[3]]=e[7]; }
      else if(k===K_PAGE){ keys+=e[5]; pages+=(e[6]||1); n=nodes[e[2]]; if(n) n.cur=e[4]; }
      else if(k===K_SPLIT||k===K_OWNER){ n=nodes[e[2]]; if(n) n.hi=e[5];
        nodes[e[3]]={lo:e[5],hi:e[6],cur:e[5],root:e[8],st:0,w:-1}; splits++;
        if(t-e[0] < 1800) marks.push({x:e[5],a:1-(t-e[0])/1800}); }
      else if(k===K_DONE||k===K_FAIL){ n=nodes[e[2]];
        if(n){ n.st=2; if(n.w>=0) delete busy[n.w]; } }
      else if(k===K_STEAL){ steals++; }
    }

    // ---- the keyspace strip: seeds, then parallel drains, then subdivision ----
    sc.clearRect(0,0,SW,SH);
    sc.fillStyle="#161D1B"; sc.fillRect(0,26,SW,SH-26);
    // the seed cuts, all of them, as the fence posts the first request paid for
    sc.strokeStyle="#3A4640"; sc.lineWidth=1;
    for(var c=0;c<CUTS.length;c++){ var cx=CUTS[c]*SW;
      sc.beginPath(); sc.moveTo(cx,26); sc.lineTo(cx,SH); sc.stroke(); }
    sc.font="15px ui-monospace,monospace"; sc.fillStyle="#74807A"; sc.textAlign="left";
    FAMS.forEach(function(f){
      var x0=f.x0*SW, w=(f.x1-f.x0)*SW;
      var txt=f.name+" "+(100*f.keys/(meta.totalKeys||1)).toFixed(0)+"%";
      if (w > txt.length*8.6) sc.fillText(txt, x0+3, 18);
      sc.strokeStyle="#29332F"; sc.lineWidth=1;
      sc.beginPath(); sc.moveTo(x0,22); sc.lineTo(x0,SH); sc.stroke();
    });
    var live=0;
    for(var id in nodes){
      var d=nodes[id]; if(d.st===2) continue;
      var x0=d.lo*SW, x1=d.hi*SW, w=Math.max(1.5,x1-x0), xc=Math.max(x0,d.cur*SW);
      var col=lin(d.root);
      if(d.st===0){ sc.globalAlpha=.30; sc.fillStyle=col; sc.fillRect(x0,30,w,SH-34); sc.globalAlpha=1; }
      else { live++;
        sc.globalAlpha=.22; sc.fillStyle=col; sc.fillRect(x0,30,w,SH-34);
        sc.globalAlpha=.92; sc.fillRect(x0,30,Math.max(0,xc-x0),SH-34);
        sc.globalAlpha=1; sc.fillStyle="#E7EBE3"; sc.fillRect(Math.max(x0,xc-1.5),30,1.5,SH-34);
      }
      if(w>3){ sc.strokeStyle="#0E1312"; sc.lineWidth=1; sc.strokeRect(x0+.5,30.5,w-1,SH-35); }
      live += 0;
    }
    // name the heaviest seed guesses in place, with their real bounds
    sc.font="14px ui-monospace,monospace";
    NAMED.forEach(function(x,ix){
      var mx=x.x0*SW, w=(x.x1-x.x0)*SW, nm=x.lo.length>34?x.lo.slice(0,33)+"\u2026":x.lo;
      if(w < nm.length*8.2) return;
      sc.fillStyle="#0E1312"; sc.globalAlpha=.72;
      sc.fillRect(mx+3,SH-24,nm.length*8.2+8,19); sc.globalAlpha=1;
      sc.fillStyle= (M.lineage[x.id]===undefined) ? "#9BA69F" : lin(x.id);
      sc.fillText(nm, mx+7, SH-10);
    });
    for(i=0;i<marks.length;i++){
      sc.globalAlpha=marks[i].a; sc.strokeStyle="#E0AC55"; sc.lineWidth=3;
      sc.beginPath(); sc.moveTo(marks[i].x*SW,26); sc.lineTo(marks[i].x*SW,SH); sc.stroke();
      sc.globalAlpha=1;
    }
    live=0; for(id in nodes){ if(nodes[id].st!==2) live++; }

    // ---- the worker pool: parallelism made literal --------------------------
    pc.clearRect(0,0,SW,PH);
    var N=meta.workers||1, cols=Math.ceil(Math.sqrt(N*SW/PH)), rows=Math.ceil(N/cols);
    var cw=SW/cols, ch=PH/rows, nbusy=0;
    for(i=0;i<N;i++){
      var cx=(i%cols)*cw, cy=Math.floor(i/cols)*ch;
      var root=busy[i];
      if(root===undefined){ pc.fillStyle="#1E2724"; pc.globalAlpha=1; }
      else { pc.fillStyle=lin(root); pc.globalAlpha=.9; nbusy++; }
      pc.fillRect(cx+2,cy+2,cw-4,ch-4); pc.globalAlpha=1;
    }

    // ---- listed-over-time: the trough is the story -------------------------
    hc.clearRect(0,0,SW,HH);
    var n=M.rate.length, upto=Math.min(n, Math.ceil(n*t/Math.max(1,D)));
    hc.beginPath(); hc.moveTo(0,HH);
    for(i=0;i<upto;i++){ hc.lineTo(SW*(i+.5)/n, HH-M.rate[i]*(HH-14)); }
    hc.lineTo(SW*Math.max(0,upto-.5)/n,HH); hc.closePath();
    hc.fillStyle="#56C9B1"; hc.globalAlpha=.30; hc.fill(); hc.globalAlpha=1;
    hc.strokeStyle="#56C9B1"; hc.lineWidth=2; hc.beginPath();
    for(i=0;i<upto;i++){ var xx=SW*(i+.5)/n, yy=HH-M.rate[i]*(HH-14);
      if(i===0) hc.moveTo(xx,yy); else hc.lineTo(xx,yy); }
    hc.stroke();

    var act=ACTS[0];
    for(i=0;i<ACTS.length;i++){ if(t>=ACTS[i].at) act=ACTS[i]; }
    document.getElementById("actn").textContent=act.n;
    document.getElementById("actt").innerHTML=act.t;
    document.getElementById("clock").textContent=secs(t)+" / "+secs(D);
    dds[0].textContent=fmt(keys); dds[1].textContent=fmt(pages);
    dds[2].textContent=fmt(live); dds[3].textContent=fmt(splits);
  }
  window.__seek=seek; window.__duration=D; seek(0);
})();
</script></body></html>
