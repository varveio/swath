<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>swath</title>
<style>
  /* Light "plotting paper" language, carried over from the field guide — deliberately not a
     dark observability dashboard, which is what the previous cut read as. */
  :root {
    --paper:#F1F2EB; --ink:#131A18; --ink2:#4E5A55; --ink3:#7C8781;
    --rule:#CBD0C2; --pale:#C5CCC0;
    --rust:#A33F28; --ochre:#9A6710; --teal:#0D6E60;
    --mono:ui-monospace,"SFMono-Regular","Cascadia Mono",Menlo,Consolas,monospace;
  }
  * { box-sizing:border-box; margin:0; }
  html,body { width:1080px; height:1350px; overflow:hidden; background:var(--paper);
              color:var(--ink); font-family:var(--mono); }
  .stage { width:1080px; height:1350px; padding:66px 64px 56px; display:flex;
           flex-direction:column; }
  #head { min-height:290px; }
  .kicker { font-size:17px; letter-spacing:.24em; text-transform:uppercase;
            color:var(--ink3); margin-bottom:20px; min-height:22px; }
  .say { font-size:56px; line-height:1.12; letter-spacing:-.035em; font-weight:500; }
  .say .r { color:var(--rust); }
  .sub { font-size:25px; color:var(--ink2); margin-top:22px; line-height:1.35; }
  .axis { font-size:18px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink3);
          margin:6px 0 14px; }
  canvas { display:block; }
  .poolrow { display:flex; align-items:center; gap:28px; margin-top:40px; }
  .poolnum { font-size:60px; letter-spacing:-.03em; font-variant-numeric:tabular-nums;
             line-height:1; }
  .poolcap { font-size:20px; color:var(--ink2); margin-top:8px; }
  #foot { margin-top:auto; font-size:19px; color:var(--ink3); }
  .card .big { font-size:74px; letter-spacing:-.04em; line-height:1.06; }
  .card ul { list-style:none; margin-top:38px; font-size:27px; line-height:1.8;
             color:var(--ink2); }
  .card ul b { color:var(--ink); }
  .card .prov { margin-top:44px; font-size:20px; color:var(--ink3); }
  .card .cta { margin-top:12px; font-size:24px; color:var(--teal); }
  .hide { visibility:hidden; }
</style></head>
<body><div class="stage">
  <div id="head">
    <div class="kicker" id="kicker"></div>
    <div class="say" id="say"></div>
    <div class="sub" id="sub"></div>
  </div>
  <div class="axis hide" id="axis"></div>
  <canvas id="strip" width="952" height="420"></canvas>
  <div class="poolrow hide" id="poolrow">
    <canvas id="pool" width="560" height="112"></canvas>
    <div><div class="poolnum" id="poolnum"></div><div class="poolcap" id="poolcap"></div></div>
  </div>
  <div id="foot"></div>
</div>
<script>
(function(){
  "use strict";
  var M = /*__MODEL__*/null; if(!M) return;
  var meta=M.meta, F=M.findings, stream=M.stream, SP=M.seedSpans||[];
  var K_CLAIM=1,K_PAGE=2,K_SPLIT=3,K_OWNER=4,K_DONE=5,K_FAIL=6;
  var D=meta.durationMs, firstSteal=F.firstStealMs===null?D*0.3:F.firstStealMs;
  function fmt(n){ return Math.round(n).toLocaleString("en-US"); }
  function mm(n){ return (n/1e6).toFixed(1)+"M"; }
  function $(id){ return document.getElementById(id); }
  function css(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
  var sc=$("strip").getContext("2d"), pc=$("pool").getContext("2d");
  var SW=952, SH=420, PW=560, PH=112;

  var HEAVY=0; for(var z=0;z<SP.length;z++){ if(SP[z][2]>SP[HEAVY][2]) HEAVY=z; }
  var HEAVY_ID = SP.length ? SP[HEAVY][3] : -1;

  // ---- the strip: guesses, the morph, and the real run --------------------
  function drawGuess(ease, wipe, hi){
    wipe = (wipe===undefined)?1:wipe; hi=(hi===undefined)?1:hi;
    sc.clearRect(0,0,SW,SH);
    var N=SP.length||1, i;
    for(i=0;i<N;i++){
      var g0=(i/N)*SW, g1=((i+1)/N)*SW, a0=SP[i][0]*SW, a1=SP[i][1]*SW;
      var x0=g0+(a0-g0)*ease, x1=g1+(a1-g1)*ease, w=Math.max(0.8,x1-x0);
      if(x0 > wipe*SW) continue;
      sc.fillStyle = (i===HEAVY) ? css("--rust") : css("--pale");
      sc.fillRect(x0,0,Math.min(w, wipe*SW-x0),SH);
      if(w>2.2){ sc.strokeStyle=css("--paper"); sc.lineWidth=1;
                 sc.strokeRect(x0+0.5,0.5,w-1,SH-1); }
    }
    if(ease<0.03){                     // the one that matters must be findable while narrow
      var hx=(HEAVY/N)*SW, hw=SW/N;
      sc.strokeStyle=css("--rust"); sc.lineWidth=4;
      sc.strokeRect(hx-4,-2,hw+8,SH+4);
    }
    if(ease>0.92 && hi>0.35){                     // name the block from inside it
      var bx=SP[HEAVY][0]*SW, bw=(SP[HEAVY][1]-SP[HEAVY][0])*SW;
      var pw=Math.min(bw-56, 500);
      if(pw>240){
        sc.fillStyle="#FFFFFF"; sc.globalAlpha=.88*Math.min(1,(hi-0.35)/0.3);
        sc.fillRect(bx+28, SH/2-70, pw, 140); sc.globalAlpha=1;
        sc.globalAlpha=Math.min(1,(hi-0.35)/0.3);
        sc.fillStyle=css("--rust"); sc.font="600 50px "+css("--mono");
        sc.fillText(mm(SP[HEAVY][2]*Math.min(1,(hi-0.35)/0.65))+" objects", bx+52, SH/2-10);
        sc.font="25px "+css("--mono"); sc.fillStyle=css("--ink2");
        sc.fillText(fmt(F.ratio)+"× the median guess", bx+52, SH/2+32); sc.globalAlpha=1;
      }
    }
  }

  function state(t){
    var nodes={}, busy={}, keys=0, splits=0, marks=[], i;
    for(i=0;i<stream.length;i++){
      var e=stream[i]; if(e[0]>t) break; var k=e[1], n;
      if(k===K_CLAIM){ n=nodes[e[2]]||(nodes[e[2]]={}); n.lo=e[4]; n.hi=e[6]; n.cur=e[5];
        n.root=e[7]; n.st=1; n.w=e[3]; busy[e[3]]=e[7]; }
      else if(k===K_PAGE){ keys+=e[5]; n=nodes[e[2]]; if(n) n.cur=e[4]; }
      else if(k===K_SPLIT||k===K_OWNER){ n=nodes[e[2]]; if(n) n.hi=e[5];
        nodes[e[3]]={lo:e[5],hi:e[6],cur:e[5],root:e[8],st:0,w:-1}; splits++;
        if(t-e[0]<2200) marks.push({x:e[5],a:1-(t-e[0])/2200}); }
      else if(k===K_DONE||k===K_FAIL){ n=nodes[e[2]];
        if(n){ n.st=2; if(n.w>=0) delete busy[n.w]; } }
    }
    return {nodes:nodes,busy:busy,keys:keys,splits:splits,marks:marks};
  }

  function drawRun(S, zoom){
    sc.clearRect(0,0,SW,SH);
    var z0=zoom?zoom[0]:0, z1=zoom?zoom[1]:1, zs=1/(z1-z0);
    function X(p){ return (p-z0)*zs*SW; }
    for(var id in S.nodes){
      var d=S.nodes[id], x0=X(d.lo), x1=X(d.hi);
      if(x1<-20||x0>SW+20) continue;
      var w=Math.max(1,x1-x0), col=(d.root===HEAVY_ID)?css("--rust"):css("--pale");
      if(d.st===2){ sc.globalAlpha=.34; sc.fillStyle=col; sc.fillRect(x0,0,w,SH); }
      else if(d.st===0){ sc.globalAlpha=.15; sc.fillStyle=col; sc.fillRect(x0,0,w,SH); }
      else { sc.globalAlpha=.20; sc.fillStyle=col; sc.fillRect(x0,0,w,SH);
             sc.globalAlpha=.95; sc.fillRect(x0,0,Math.max(0,X(d.cur)-x0),SH); }
      sc.globalAlpha=1;
      if(w>2.2){ sc.strokeStyle=css("--paper"); sc.lineWidth=1; sc.strokeRect(x0+.5,.5,w-1,SH-1); }
    }
    for(var i=0;i<S.marks.length;i++){
      var mk=S.marks[i], mx=X(mk.x); if(mx<-2||mx>SW+2) continue;
      sc.globalAlpha=mk.a; sc.strokeStyle=css("--ochre"); sc.lineWidth=3;
      sc.beginPath(); sc.moveTo(mx,0); sc.lineTo(mx,SH); sc.stroke(); sc.globalAlpha=1;
    }
  }

  function drawPool(S){
    pc.clearRect(0,0,PW,PH);
    var N=meta.workers||1, cols=16, rows=Math.ceil(N/cols), cw=PW/cols, ch=PH/rows, n=0;
    for(var i=0;i<N;i++){
      var cx=(i%cols)*cw, cy=Math.floor(i/cols)*ch, root=S.busy[i];
      if(root===undefined){ pc.fillStyle=css("--rule"); pc.globalAlpha=.55; }
      else { n++; pc.fillStyle=(root===HEAVY_ID)?css("--rust"):css("--teal"); pc.globalAlpha=.92; }
      pc.fillRect(cx+2,cy+2,cw-4,ch-4); pc.globalAlpha=1;
    }
    return n;
  }

  // ---- the cut: scenes in VIDEO time, not run time ------------------------
  function say(k,big,sub){ $("kicker").textContent=k||"";
    $("say").innerHTML=big||""; $("sub").innerHTML=sub||""; }
  function show(id,on){ $(id).classList.toggle("hide", !on); }

  var FIRST_SPLIT=(function(){ for(var i=0;i<stream.length;i++){ var e=stream[i];
    if((e[1]===K_SPLIT||e[1]===K_OWNER) && e[8]===HEAVY_ID) return e; } return null; })();

  var CARD='<div class="card"><div class="big">'+fmt(meta.totalKeys)+
    ' objects<br>in 4m 24s</div><ul>'+
    '<li><b>'+fmt(F.seedCount)+'</b> initial guesses</li>'+
    '<li><b>'+fmt(F.topSplits)+'</b> splits inside the overloaded one</li>'+
    '<li>all <b>'+meta.workers+'</b> workers eventually helped</li>'+
    '<li><b>0</b> failed ranges · no gaps, no overlaps</li></ul>'+
    '<div class="prov">Every split shown came from the actual '+fmt(meta.events)+
    '-event trace. Nothing simulated.</div>'+
    '<div class="cta">swath — it maps the bucket while it sweeps it</div></div>';
  var HEAD='<div class="kicker" id="kicker"></div><div class="say" id="say"></div>'+
           '<div class="sub" id="sub"></div>';

  var SCENES=[
   {t:1300, f:function(u){ $("head").innerHTML=HEAD; show("axis",0); show("poolrow",0);
     $("strip").style.visibility="hidden";
     say("", "<span class='r'>"+fmt(F.seedCount)+" guesses.</span><br>One held <span class='r'>"+
         F.topShare+"%</span> of the bucket.",
         "An actual swath run · "+mm(meta.totalKeys)+" S3 objects"); }},
   {t:3000, f:function(u){ $("strip").style.visibility="visible"; show("axis",1);
     $("axis").textContent="initial plan — "+fmt(F.seedCount)+" equal guesses";
     say("1 · guess", "S3 would not say where the work was.", "");
     drawGuess(0, Math.min(1, u*1.6)); }},
   {t:3900, f:function(u){ $("axis").textContent="measuring what was really there…";
     say("2 · discover", "Now widen each guess to what it really held.", "");
     drawGuess(u*u*(3-2*u), 1); }},
   {t:6200, f:function(u){ $("axis").textContent="real work — width = objects";
     say("2 · discover", "One guess held <span class='r'>"+
         (F.topShare*Math.min(1,u*2.2)).toFixed(0)+"%</span> of the bucket.", "");
     drawGuess(1, 1, Math.min(1, u*2.2)); }},
   {t:9200, f:function(u){ show("poolrow",1);
     $("axis").textContent="the real run — width = objects";
     var S=state(u*firstSteal*0.62), n=drawPool(S); drawRun(S);
     $("poolnum").textContent=n+" / "+meta.workers; $("poolcap").textContent="workers busy";
     say("3 · rebalance", meta.workers+" workers start in parallel.", ""); }},
   {t:12600, f:function(u){ var S=state(firstSteal*(0.62+0.38*u)), n=drawPool(S); drawRun(S);
     $("poolnum").textContent=n+" / "+meta.workers; $("poolcap").textContent="workers busy";
     say("3 · rebalance", "The easy guesses finish first.",
         "Most of the fleet has nothing left to do."); }},
   {t:15600, f:function(u){
     if(!FIRST_SPLIT){ return; }
     var lo=Math.max(0,FIRST_SPLIT[5]-0.09), hi=Math.min(1,FIRST_SPLIT[6]+0.015);
     var S=state(FIRST_SPLIT[0]+(u>0.45?600:-600));
     drawRun(S,[lo,hi]);
     if(u>0.45){ var mx=((FIRST_SPLIT[5]-lo)/(hi-lo))*SW;
       sc.strokeStyle=css("--ochre"); sc.lineWidth=6;
       sc.beginPath(); sc.moveTo(mx,0); sc.lineTo(mx,SH); sc.stroke(); }
     drawPool(S); $("poolnum").textContent=""; $("poolcap").textContent="";
     $("axis").textContent="one split, close up";
     say("3 · rebalance", "An idle worker cuts the survivor in two.",
         "The boundary need not be a key that exists."); }},
   {t:29000, f:function(u){ var S=state(firstSteal+(D-firstSteal)*u), n=drawPool(S);
     drawRun(S); $("axis").textContent="the real run — width = objects";
     $("poolnum").textContent=fmt(S.splits); $("poolcap").textContent="splits committed";
     say("3 · rebalance", fmt(S.splits)+" splits later…",
         (S.splits > F.topSplits*0.6 && n>=meta.workers-4) ? "…all "+meta.workers+
           " workers are inside one original guess." : ""); }},
   {t:34000, f:function(){ show("axis",0); show("poolrow",0);
     $("strip").style.visibility="hidden"; $("head").innerHTML=CARD; }}
  ];

  $("foot").textContent="Rendered from the actual run trace. Nothing simulated.";

  function seek(vt){
    var prev=0;
    for(var i=0;i<SCENES.length;i++){
      if(vt < SCENES[i].t || i===SCENES.length-1){
        SCENES[i].f(Math.max(0,Math.min(1,(vt-prev)/Math.max(1,SCENES[i].t-prev))));
        return;
      }
      prev=SCENES[i].t;
    }
  }
  window.__seek=seek; window.__duration=34000; window.__videoTime=true; seek(0);
})();
</script></body></html>
