# Safe, build-level parallelism (task graph across the swath-model / swath-core /
# swath-s3 / swath-cli / swath-replay-server modules, and cached task outputs).
# Does NOT change test execution semantics —
# maxParallelForks / JUnit concurrent execution are deliberately left unset (see
# docs/ops/dev/TESTING.md); several integration tests share Docker/LocalStack and
# haven't been verified safe to run concurrently.
org.gradle.parallel=true
org.gradle.caching=true

# Single source of truth for every Gradle-produced artifact. Release automation
# verifies that a vX.Y.Z tag exactly matches this value before publishing.
version=0.1.0
