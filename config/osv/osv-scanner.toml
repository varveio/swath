# ---------------------------------------------------------------------------------------
# golang.org/x/crypto/openpgp (GO-2026-5932, fixed only in the pseudo-version
# v0.58.1-0.20261009181718-2f1f834330b2)
#
# The advisory covers only the openpgp packages, so the module stays on its tagged release. The image scan reads the module list
# embedded in the Go binaries, so any build linking golang.org/x/crypto reports it. swath
# links pkcs12, chacha20poly1305, cryptobyte and hkdf from that module and no openpgp
# package: `go list -deps ./cmd/swath ./cmd/swath-replay | grep openpgp` is empty.
# Revisit at the date below, or if a dependency starts importing openpgp.
# ---------------------------------------------------------------------------------------

[[IgnoredVulns]]
id = "GO-2026-5932"
ignoreUntil = 2027-02-10
reason = "golang.org/x/crypto/openpgp is not linked into swath or swath-replay; the binary scan reports the module, not the package"
