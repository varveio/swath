# Dependabot keeps the SHA-pinned inputs current.
#
# Every action in .github/workflows/ is pinned by commit SHA and every Dockerfile
# FROM by image digest, which is the right call for supply-chain integrity — but a
# pin never moves on its own. Without this file the pins silently rot: in a year the
# workflows run year-old runners and the image ships a year-old JRE with known CVEs,
# and nobody notices because nothing is red. Pinning and automated bumping are one
# practice, not two; this file is the second half.
#
# Dependabot rewrites the SHA and updates the trailing `# v4` comment, so the pins
# stay readable after a bump.
#
# Everything is grouped and weekly on purpose: this is a solo-maintainer repo, and a
# dozen individual dependency PRs a week is how update automation gets muted. One PR
# per ecosystem per week is reviewable; muted automation is not.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  # The root build: version catalog (gradle/libs.versions.toml) + module build files.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Test-only dependencies can move on their own cadence — a JUnit or Testcontainers
      # bump carries no shipped-artifact risk, so it should not queue behind review of a
      # Parquet/Hadoop bump that does.
      test-dependencies:
        patterns:
          - "org.junit*"
          - "org.assertj*"
          - "org.mockito*"
          - "org.testcontainers*"
          - "net.jqwik*"
      production-dependencies:
        exclude-patterns:
          - "org.junit*"
          - "org.assertj*"
          - "org.mockito*"
          - "org.testcontainers*"
          - "net.jqwik*"
        patterns: ["*"]
    commit-message:
      prefix: "deps"

  # build-logic is a separate included build (settings.gradle.kts: includeBuild), so
  # its dependencies are invisible to the root scan above and need their own entry.
  - package-ecosystem: gradle
    directory: /build-logic
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      build-logic:
        patterns: ["*"]
    commit-message:
      prefix: "deps"

  # Keeps the digest-pinned base images current: eclipse-temurin in the Java Dockerfiles
  # (a stale JRE in every published image) and golang and distroless in Dockerfile.go.
  # Dependabot reads every file in the directory whose name contains "dockerfile", so
  # Dockerfile.go and Dockerfile.replay need no entry of their own.
  #
  # The golang tag moves independently of the `toolchain` line in go/go.mod, which
  # Dependabot never raises on its own; raise them together (see Dockerfile.go).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      base-images:
        patterns: ["*"]
    commit-message:
      prefix: "deps"

  # The Go modules are separate (no go.work), so each directory needs its own entry.
  - package-ecosystem: gomod
    directory: /go
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      go:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "deps"

  - package-ecosystem: gomod
    directory: /go/reader
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      go-reader:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "deps"

  - package-ecosystem: gomod
    directory: /go/objfile
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      go-objfile:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "deps"
