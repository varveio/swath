# Dependabot keeps the SHA-pinned inputs current.
#
# Every action in .github/workflows/ is pinned by commit SHA and every Dockerfile
# FROM by image digest, which is the right call for supply-chain integrity — but a
# pin never moves on its own. Without this file the pins silently rot: in a year the
# workflows run year-old runners and the image ships a year-old base with known CVEs,
# and nobody notices because nothing is red. Pinning and automated bumping are one
# practice, not two; this file is the second half.
#
# Dependabot rewrites the SHA and updates the trailing `# v4` comment, so the pins
# stay readable after a bump.
#
# Everything is grouped and weekly on purpose: this is a solo-maintainer repo, and a
# dozen individual dependency PRs a week is how update automation gets muted. One PR
# per ecosystem per week is reviewable; muted automation is not.
version: 2
updates:
  # "/" covers .github/workflows only; the composite actions under .github/actions pin their
  # own actions (setup-go, cache) and need their directories named to be bumped at all.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  # Keeps the digest-pinned base images current: golang and distroless in the Dockerfile.
  #
  # The golang tag moves independently of the `toolchain` line in go.mod, which
  # Dependabot never raises on its own; raise them together (see the Dockerfile).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      base-images:
        patterns: ["*"]
    commit-message:
      prefix: "deps"

  # The Go modules are one dependency graph: the root module replaces `objfile` and `reader` by
  # local path and there is no go.work, so the root's go.mod must require at least what the nested
  # modules require, or every `go` command at the root fails with "updates to go.mod needed". A pull
  # request that bumps one module alone is therefore red by construction (#541 bumped
  # cloud.google.com/go/auth in /objfile only). All three directories are one `directories` entry,
  # so a group is one pull request across them, and `allow: all` lets the root and `reader` follow
  # a dependency that is direct in one module and indirect in another.
  #
  # The Azure SDK changes swath's wire requests in minor releases, so its modules are reviewed
  # in a pull request of their own, against the client's wire snapshot.
  - package-ecosystem: gomod
    directories: ["/", "/objfile", "/reader"]
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    allow:
      - dependency-type: all
    groups:
      go-azure:
        patterns: ["github.com/Azure/azure-sdk-for-go/*"]
        update-types: [minor, patch]
      go:
        patterns: ["*"]
        exclude-patterns: ["github.com/Azure/azure-sdk-for-go/*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "deps"

  # The website's build: VitePress and its dependencies, from site/package-lock.json. VitePress
  # stays on 1.x: the 2.0 line is still in alpha, so its major updates are not proposed.
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: vitepress
        update-types: ["version-update:semver-major"]
    groups:
      site:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "deps"
