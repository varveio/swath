name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  # Manual trigger so maintainers can run the full pipeline from any branch on demand.
  workflow_dispatch:

permissions:
  contents: read

# Top-level concurrency ONLY coalesces PRs: a new push to a PR cancels the
# superseded run (saves minutes). main/dispatch runs each get a UNIQUE group
# (github.run_id), so they are NEVER serialized/cancelled here — every merge runs
# its full test suite. Nothing here pushes to GHCR; release.yml alone publishes images.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # The policy owns module dependencies, external inputs and escalation. Main and
  # dispatch always validate the complete Go tree; PRs select complete modules.
  # Jobs still run when unaffected, with their work skipped, so ci-gate stays strict.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.changes.outputs.go }}
      reader: ${{ steps.changes.outputs.reader }}
      objfile: ${{ steps.changes.outputs.objfile }}
      fixtures: ${{ steps.changes.outputs.fixtures }}
      images: ${{ steps.changes.outputs.images }}
      platforms: ${{ steps.changes.outputs.platforms }}
      full: ${{ steps.changes.outputs.full }}
      go_shards: ${{ steps.shards.outputs.matrix }}
      go_xos: ${{ steps.xos.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect Go-relevant changes
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels || fromJSON('[]')) }}
        run: python3 scripts/ci/go-ci-policy.py

      - name: CI policy regression tests
        run: |
          python3 scripts/ci/test-ci-policy.py
          python3 scripts/ci/test-release-go-ci.py
          ./scripts/ci/go-race-shards.sh --self-test

      # Always computed: go-race expands it before its steps can skip. When go=false it is one
      # step-skipped leg on ubuntu-latest, not every shard's (arm64) runner.
      - name: Go race shard matrix
        id: shards
        env:
          GO_CHANGED: ${{ steps.changes.outputs.go }}
        run: |
          set -euo pipefail
          if [ "$GO_CHANGED" = true ]; then
            matrix=$(./scripts/ci/go-race-shards.sh --matrix)
          else
            matrix='[{"shard":"off","runner":"ubuntu-latest"}]'
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "go-race shards: $matrix"

      # The ordinary PR arm64 leg covers only packages raced on amd64. Escalated
      # PRs and main/dispatch run the full suite on all platforms. An off leg
      # succeeds without queueing a platform runner when no selected module needs it.
      - name: Go cross-OS matrix
        id: xos
        env:
          GO_CHANGED: ${{ steps.changes.outputs.go }}
          GO_ANY: ${{ steps.changes.outputs.go == 'true' || steps.changes.outputs.reader == 'true' || steps.changes.outputs.objfile == 'true' }}
          PLATFORMS: ${{ steps.changes.outputs.platforms }}
        run: |
          set -euo pipefail
          if [ "$GO_ANY" != true ]; then
            matrix='[{"os":"off","runner":"ubuntu-latest","scope":"off"}]'
          elif [ "$PLATFORMS" = true ]; then
            matrix='[{"os":"macos-latest","runner":"macos-latest","scope":"full"},{"os":"windows-latest","runner":"windows-latest","scope":"full"},{"os":"ubuntu-24.04-arm","runner":"ubuntu-24.04-arm","scope":"full"}]'
          elif [ "$GO_CHANGED" = true ]; then
            matrix='[{"os":"ubuntu-24.04-arm","runner":"ubuntu-24.04-arm","scope":"extra"}]'
          else
            matrix='[{"os":"off","runner":"ubuntu-latest","scope":"off"}]'
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "go-xos legs: $matrix"

  # Self-tests of the Python scripts that no Go job runs: the OSV image policy (synthetic
  # fixtures keep its fail-closed parsing of scanner JSON and Ubuntu USN groups under the
  # per-commit gate without downloading a scanner database or building an image), the
  # provider-conformance campaign, evidence and ledger tools, and the replay benchmark
  # runners' statistics, fault and observer helpers. Hermetic and a few seconds long,
  # so they run on every event without change detection.
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: OSV image-policy self-test
        run: python3 ./scripts/ci/osv-image-policy.py --self-test

      - name: Provider-conformance script tests
        run: python3 -m unittest discover -s scripts/provider-conformance -p 'test_*.py'

      - name: Replay benchmark runner tests
        run: python3 -m unittest discover -s scripts/benchmarks/replay -p 'test_*.py'

  # Go jobs run concurrently. PRs test complete affected modules; main/dispatch
  # select all modules, platforms, fixtures and images for release qualification.
  # The cheap verdicts first: formatting, vet, and the race shard table's own check (every
  # package and every test of a split package in exactly one shard).
  go-lint:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go (version from go/go.mod)
        if: needs.changes.outputs.go == 'true' || needs.changes.outputs.reader == 'true' || needs.changes.outputs.objfile == 'true'
        uses: ./.github/actions/setup-go
        with:
          key: go-lint

      - name: gofmt
        if: needs.changes.outputs.go == 'true' || needs.changes.outputs.reader == 'true' || needs.changes.outputs.objfile == 'true'
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt -l lists files that are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        if: needs.changes.outputs.go == 'true'
        run: go vet ./...

      # go.mod and go.sum are what the code imports: a dependency added, dropped or moved
      # between direct and indirect without `go mod tidy` fails here, with the diff.
      - name: go mod tidy -diff
        if: needs.changes.outputs.go == 'true'
        run: go mod tidy -diff

      - name: Race shard table self-test
        if: needs.changes.outputs.go == 'true'
        run: ../scripts/ci/go-race-shards.sh --self-test

      - name: Race shards cover every test once
        if: needs.changes.outputs.go == 'true'
        run: ../scripts/ci/go-race-shards.sh --check

  # go test -race, one leg per row of scripts/ci/go-race-shards.sh (the changes job expands its
  # table into this matrix, so the table is the one place a shard is added). A leg's name is its
  # shard; the step prints the exact `go test` command to rerun it locally. fail-fast is off so
  # one red shard still lets the others report. go test's -timeout is per package binary, so it
  # is set to leave the job's limit room for setup, compiling and the packages queued ahead of
  # the last one (the unsplit `rest` shard took ~6 min): a hang ends in go test's goroutine dump,
  # not a killed runner. -count=1: the restored build cache would otherwise replay a shard's
  # earlier results as `(cached)` instead of racing it. The -json stream is kept as the go-race-SHARD artifact (per-test
  # starts and times, passing subtests included) for flakes and rebalancing.
  go-race:
    needs: changes
    name: go-race (${{ matrix.shard }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.go_shards) }}
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go (version from go/go.mod)
        if: needs.changes.outputs.go == 'true'
        uses: ./.github/actions/setup-go
        with:
          key: go-race-${{ matrix.shard }}

      - name: go test -race (shard ${{ matrix.shard }})
        if: needs.changes.outputs.go == 'true'
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          # Captured first, so a failing script fails the step instead of running no arguments.
          shard_args=$(../scripts/ci/go-race-shards.sh "$SHARD")
          mapfile -t args <<<"$shard_args"
          printf 'go test -race -count=1 -timeout 20m'; printf " '%s'" "${args[@]}"; echo
          json="$RUNNER_TEMP/go-race.json"
          # The log shows each package's own output live (its ok/FAIL line, a timeout's dump), then
          # the output of every failed test; the full stream is the artifact.
          set +e
          go test -race -count=1 -timeout 20m -json "${args[@]}" | tee "$json" |
            jq --unbuffered -rj 'select(.Action == "output" and .Test == null) | .Output'
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::group::output of the failed tests"
            jq -rjs '(map(select(.Action == "fail" and .Test != null) | [.Package, .Test]) | unique) as $failed
              | .[] | select(.Action == "output" and .Test != null and ([.Package, .Test] as $k | $failed | index([$k])))
              | .Output' "$json"
            echo "::endgroup::"
          fi
          exit "$status"

      - name: Upload the go test -json stream
        if: always() && needs.changes.outputs.go == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: go-race-${{ matrix.shard }}
          path: ${{ runner.temp }}/go-race.json
          if-no-files-found: ignore
          retention-days: 14

  # The tests that measure the process and so must not run under -race, which distorts heap and
  # time: each opted in by its own gate, one step per tier.
  go-nonrace:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go (version from go/go.mod)
        if: needs.changes.outputs.go == 'true'
        uses: ./.github/actions/setup-go
        with:
          key: go-nonrace

      # The writer admission's heap gate (go/docs/internals/testing.md): its full arms allocate hundreds of
      # MiB and measure the live heap, which -race distorts, so they run here without it, opted in.
      - name: Heap gates (SWATH_HEAP_GATES=1, no -race)
        if: needs.changes.outputs.go == 'true'
        env:
          SWATH_HEAP_GATES: "1"
        run: go test -count=1 -timeout 15m -run '^TestWriterAdmissionCoversHeap$' ./internal/listing

      # The shape suite at 200,000 keys per shape (internal/shapes, go/docs/internals/testing.md): a
      # measurement with order-of-magnitude bounds, skipped under -race (ten times slower, and the
      # code it drives is race-tested by its own packages), so it runs here without it.
      - name: Shape suite (TestShapes, no -race)
        if: needs.changes.outputs.go == 'true'
        run: go test -count=1 -timeout 15m -run '^TestShapes$' ./internal/shapes

      # SeekParquet conformance (go/docs/internals/testing.md): the suite's reader target against the Go
      # adapter of the seekparquet module go.mod pins, then this build's datasets validated by the
      # suite's reference adapter (full and digest) and read alike by both adapters.
      - name: SeekParquet conformance
        if: needs.changes.outputs.go == 'true'
        run: ../scripts/ci/seekparquet-conformance.sh "$RUNNER_TEMP/seekparquet-conformance"

  # Static cross-builds stay on every main-module PR. Packaged images run on
  # main/dispatch and packaging/dependency/escalated PRs; the license gate stays on all.
  go-build:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go (version from go/go.mod)
        if: needs.changes.outputs.go == 'true'
        uses: ./.github/actions/setup-go
        with:
          key: go-build

      - name: Static cross-builds (CGO_ENABLED=0)
        if: needs.changes.outputs.go == 'true'
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            for cmd in swath swath-replay; do
              echo "building $cmd for $target"
              GOOS="${target%/*}" GOARCH="${target#*/}" SWATH_REVISION="$GITHUB_SHA" \
                ./build.sh -o "$RUNNER_TEMP/$cmd-${target%/*}-${target#*/}" "./cmd/$cmd"
            done
          done
          # The journal's tests (its Windows lock test included) compile for Windows without
          # cgo, as the static builds do; go-xos (windows) runs them.
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go test -c -o "$RUNNER_TEMP/journal-windows.test" ./internal/journal
          # Each CI build names its commit (build.sh stamps it).
          for cmd in swath swath-replay; do
            "$RUNNER_TEMP/$cmd-linux-amd64" --version | tee /dev/stderr | grep -q "$GITHUB_SHA"
          done

      # Preserve the license gate when a PR does not build the packaged images.
      - name: Linked-module license gate
        if: needs.changes.outputs.go == 'true' && needs.changes.outputs.images != 'true'
        run: ./notices.sh "$RUNNER_TEMP/THIRD_PARTY_NOTICES"

      # The Go images, built as release.yml builds them but compiled here rather than promoted
      # from release archives: both architectures of each target (no push), then the
      # builder-native ones loaded for the smokes. No QEMU: the build stage cross-compiles and
      # neither runtime stage has a RUN, so the arm64 builds here also guard against a runtime
      # stage that would need emulation. The two targets share the build stage, so the second
      # build reuses the first's layers from the builder and only the first writes the cache.
      - name: Set up Docker Buildx
        if: needs.changes.outputs.images == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build Go lister image (both architectures, no push)
        if: needs.changes.outputs.images == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile.go
          target: swath
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: SWATH_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=swath-go
          # Written from main only: a pull request's cache is scoped to its own ref and serves no
          # other run, while costing the repository's cache quota (about 600 MiB per pull
          # request); a pull request reads main's.
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,scope=swath-go,mode=max' || '' }}

      - name: Build Go replay image (both architectures, no push)
        if: needs.changes.outputs.images == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile.go
          target: swath-replay
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: SWATH_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=swath-go

      - name: Build Go lister image (builder-native arch) + load for smoke
        if: needs.changes.outputs.images == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile.go
          target: swath
          load: true
          tags: swath-go:ci
          build-args: SWATH_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=swath-go

      - name: Build Go replay image (builder-native arch) + load for smoke
        if: needs.changes.outputs.images == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile.go
          target: swath-replay
          load: true
          tags: swath-replay-go:ci
          build-args: SWATH_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=swath-go

      # The lister smoke reads the dataset back with DuckDB, checksum-verified before it runs.
      - name: Install DuckDB CLI
        if: needs.changes.outputs.images == 'true'
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/duckdb/duckdb/releases/download/v2.0.0/duckdb-cli-linux-amd64.tar.gz -o /tmp/duckdb.tar.gz
          echo "c6507206baf7793c6013dbd82368469a45f20dc0e17a6f92f204602f652ed2bc  /tmp/duckdb.tar.gz" | sha256sum --check -
          mkdir -p /tmp/duckdb
          tar -xzf /tmp/duckdb.tar.gz -C /tmp/duckdb
          sudo install /tmp/duckdb/duckdb /usr/local/bin/duckdb
          duckdb --version

      # Three smokes on data written here, so they need no network and no recording.
      # The lister image runs the release's smoke script against a fake bucket (bench/s3fake):
      # list into a dataset, read it back with DuckDB, resume it as a no-op. Its dataset is
      # sorted, so the replay server opens it as it is. The unsorted capture from
      # bench/replay/capture is refused as not servable sorted, so the replay smoke's fallback
      # sorts it with the image's own sort-fixture first; the step requires that the fallback ran.
      - name: Smoke — Go lister image writes a dataset; Go replay image serves it and a sorted capture
        if: needs.changes.outputs.images == 'true'
        run: |
          set -euo pipefail
          for image in swath-go:ci swath-replay-go:ci; do
            docker run --rm "$image" --version | tee /dev/stderr | grep -q "$GITHUB_SHA"
          done
          smoke="$RUNNER_TEMP/image-smoke"
          mkdir -p "$smoke"
          go build -o "$smoke/s3fake" ./bench/s3fake
          awk 'BEGIN { for (i = 0; i < 2000; i++) printf "logs/p%02d/obj-%05d.json\t%d\n", i % 37, i, 1767225600000000 + i * 1000000 }' >"$smoke/keys.tsv"
          "$smoke/s3fake" -keys "$smoke/keys.tsv" -bucket smoke -addr 127.0.0.1:19400 &
          fake=$!
          trap 'kill "$fake"' EXIT
          for _ in $(seq 80); do curl -fs -o /dev/null http://127.0.0.1:19400/smoke && break; sleep 0.25; done
          SWATH_SMOKE_BUCKET=s3://smoke SWATH_SMOKE_ENDPOINT=http://127.0.0.1:19400 \
            ../scripts/ci/smoke-container.sh swath-go:ci "$smoke/lister"
          ../scripts/ci/smoke-replay-container.sh swath-replay-go:ci "$smoke/lister/data" sorted
          go run ./bench/replay/capture -rows 2000 -o "$smoke/capture"
          ../scripts/ci/smoke-replay-container.sh swath-replay-go:ci "$smoke/capture" sorted 2>&1 |
            tee "$smoke/capture-smoke.log"
          grep -q "sorting it with the image's sort-fixture" "$smoke/capture-smoke.log"

  # go/objfile, a nested module (its own go.mod, so the jobs above, which run in go/, never
  # see it): vet, tidiness, race tests and the static cross-builds. go-lint's gofmt covers it.
  go-objfile:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: go/objfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go (version from go/go.mod)
        if: needs.changes.outputs.objfile == 'true'
        uses: ./.github/actions/setup-go
        with:
          key: go-objfile

      - name: vet, tidy, race tests, static cross-builds
        if: needs.changes.outputs.objfile == 'true'
        run: |
          set -euo pipefail
          go vet ./...
          go mod tidy -diff
          go test -race -count=1 -timeout 10m ./...
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go build ./...
          done

  # The reader module (go/reader), a nested module of its own: vet, tidiness, the race tests
  # (the dependency-graph check among them) and the static cross-builds. go-lint's gofmt
  # covers it; the main module's tests decode its own writer's datasets with it.
  go-reader:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: go/reader
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go (version from go/go.mod)
        if: needs.changes.outputs.reader == 'true'
        uses: ./.github/actions/setup-go
        with:
          key: go-reader

      - name: vet, tidy, race tests, static cross-builds
        if: needs.changes.outputs.reader == 'true'
        run: |
          set -euo pipefail
          go vet ./...
          go mod tidy -diff
          go test -race -count=1 -timeout 5m ./...
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go build ./...
          done

  # Ordinary PRs keep arm64 coverage of the packages raced on amd64, without
  # repeating the CLI/engine matrices already raced on arm64. The shard table owns
  # that complement. Escalated PRs/main/dispatch run every selected module in full.
  go-xos:
    needs: changes
    name: go-xos (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.go_xos) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go (version from go/go.mod)
        if: matrix.scope != 'off'
        uses: ./.github/actions/setup-go
        with:
          key: go-xos

      - name: Main module vet and tests (no -race)
        if: matrix.scope != 'off' && needs.changes.outputs.go == 'true'
        env:
          SCOPE: ${{ matrix.scope }}
        run: |
          set -euo pipefail
          packages=(./...)
          if [ "$SCOPE" = extra ]; then
            selected=$(../scripts/ci/go-race-shards.sh --arm64-extra)
            mapfile -t packages <<<"$selected"
          fi
          go vet "${packages[@]}"
          go test -count=1 -timeout 25m "${packages[@]}"

      - name: Reader module vet and tests (no -race)
        if: matrix.scope == 'full' && needs.changes.outputs.reader == 'true'
        working-directory: go/reader
        run: go vet ./... && go test -count=1 -timeout 15m ./...

      - name: Object-file module vet and tests (no -race)
        if: matrix.scope == 'full' && needs.changes.outputs.objfile == 'true'
        working-directory: go/objfile
        run: go vet ./... && go test -count=1 -timeout 15m ./...

  # The replay fixture tier: go/bench/replay/fixtures writes the synthetic and evidence
  # fixtures, and the gated replay tests run on them. The shared policy selects it with main
  # and reader changes and the evidence inputs of these fixtures.
  go-fixtures:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go (version from go/go.mod)
        if: needs.changes.outputs.fixtures == 'true'
        uses: ./.github/actions/setup-go
        with:
          key: go-fixtures

      - name: Replay fixtures
        if: needs.changes.outputs.fixtures == 'true'
        run: go run ./bench/replay/fixtures "$RUNNER_TEMP/replay-fixtures/fixtures"

      # FIXTURE_PACKAGES and FIXTURE_TESTS select the gated tests this tier runs; a new gated
      # test is added to both. Every named test must run and pass: a name that matches nothing,
      # or a test that skips (the gate it reads unset), would otherwise pass vacuously.
      - name: Gated replay tests on the replay fixtures
        if: needs.changes.outputs.fixtures == 'true'
        env:
          SWATH_REPLAY_FIXTURES: ${{ runner.temp }}/replay-fixtures
          FIXTURE_PACKAGES: ./internal/replay/store ./internal/replay/evidence ./internal/replay/azure
          FIXTURE_TESTS: >-
            TestGeneratedFixtures
            TestSortsTheAzureEvidenceCorpus
            TestStartupCost
            TestSortFixtureMemory
            TestGCSNativeCapturesMatchReplay
            TestEvidenceRejectsCorruptedReplayResults
            TestAzureEvidenceReplay
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/fixture-tests.log"
          # shellcheck disable=SC2086 # FIXTURE_PACKAGES is a word list.
          go test -count=1 -v -run "^($(tr ' ' '|' <<<"$FIXTURE_TESTS"))\$" $FIXTURE_PACKAGES | tee "$log"
          if grep -q -- '--- SKIP' "$log"; then
            echo "::error::a fixture-tier test skipped"
            exit 1
          fi
          # The Azure evidence replay falls back to the manifest in memory when the fixture
          # capture under the fixture root is missing; here the capture is the point, so that
          # fallback fails the tier. (The Azure corruption test serves from memory by design and
          # logs the root-less path, which this does not match.)
          if grep -qF "no $SWATH_REPLAY_FIXTURES/fixtures/evidence-azure/capture:" "$log"; then
            echo "::error::the Azure evidence replay did not use fixtures/evidence-azure/capture"
            exit 1
          fi
          want=$(tr ' ' '\n' <<<"$FIXTURE_TESTS" | sort -u)
          ran=$(sed -n 's/^--- PASS: \([^ ]*\) .*/\1/p' "$log" | sort -u)
          if [ "$ran" != "$want" ]; then
            echo "::error::fixture-tier tests that did not run: $(comm -23 <(echo "$want") <(echo "$ran") | paste -sd' ' -)"
            exit 1
          fi

  # The single required status check on `main`, and the only job here that exists for the
  # branch rule rather than for what it runs.
  #
  # GitHub can only require a check by NAME, and a matrix job expands into one context per leg
  # (`go-race (crash)`, ...): a rule naming `go-race` matches nothing, and naming the legs
  # individually goes stale the moment a leg is added or renamed.
  # One aggregate job has a single stable name, and `needs` already collapses every leg of a
  # matrix into one result — so adding a leg extends the gate for free. Requiring the tiers
  # individually has a second failure mode this avoids: a single-module `check` once reported a
  # cross-module change green (08-19), and a rule listing job names cannot notice that.
  #
  # `if: always()` is not optional. Without it a failed dependency SKIPS this job, a skipped
  # required check never reports a conclusion, and the pull request waits forever instead of
  # going red.
  ci-gate:
    needs: [changes, scripts, go-lint, go-race, go-nonrace, go-build, go-objfile, go-reader, go-xos, go-fixtures]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Unaffected jobs succeed with skipped steps. A skipped job is never a pass:
      # main's full Go qualification must prove that every selected tier actually ran.
      - name: Every gating job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          allowed='["success"]'
          {
            echo "### CI gate"
            echo
            echo "| job | result |"
            echo "| --- | --- |"
            jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<<"$NEEDS"
          } >> "$GITHUB_STEP_SUMMARY"
          failed=$(jq -r --argjson allowed "$allowed" \
            'to_entries[] | select(.value.result as $r | $allowed | index($r) | not) | .key' <<<"$NEEDS")
          if [ -n "$failed" ]; then
            echo "::error::CI gate failed — not passing: $(echo "$failed" | paste -sd', ' -)"
            exit 1
          fi
          echo "CI gate passed."

  # Full-scope PRs exercise this gate too; release accepts only its main push
  # result at the exact SHA. Ordinary scoped PRs do not emit this qualification.
  go-full-gate:
    needs: [changes, go-lint, go-race, go-nonrace, go-build, go-objfile, go-reader, go-xos, go-fixtures]
    if: always() && (github.event_name != 'pull_request' || needs.changes.outputs.full == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Full Go validation passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          SELECTION: ${{ toJSON(needs.changes.outputs) }}
        run: |
          set -euo pipefail
          jq -e 'all(.[]; .result == "success")' <<<"$NEEDS"
          shards=$(./scripts/ci/go-race-shards.sh --matrix)
          jq -e --argjson shards "$shards" '
            (.full == "true") and (.go == "true") and (.reader == "true") and
            (.objfile == "true") and (.fixtures == "true") and (.images == "true") and
            (.platforms == "true") and (.go_shards | fromjson == $shards) and
            (.go_xos | fromjson |
              (map(.os) | sort) == ["macos-latest", "ubuntu-24.04-arm", "windows-latest"] and
              all(.[]; .scope == "full" and .runner == .os))' <<<"$SELECTION"
