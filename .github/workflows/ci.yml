name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual trigger so maintainers can run the full pipeline — including the
  # image build + GHCR push (docker-publish) — from any branch on demand.
  workflow_dispatch:

permissions:
  contents: read

# Top-level concurrency ONLY coalesces PRs: a new push to a PR cancels the
# superseded run (saves minutes). main/dispatch runs each get a UNIQUE group
# (github.run_id), so they are NEVER serialized/cancelled here — every merge runs
# its full test suite. Publish serialization is a separate concern handled at the
# docker-publish job level (a single global group), so no two publishes can race
# the shared GHCR tags even though the runs themselves run in parallel.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Shared change detection for the Java tiers and the Go jobs. java=false ONLY when every changed
  # file is Go-only (go/**, Dockerfile.replay-go and its ignore file); anything else -- this
  # workflow, root build files, docs, scripts, Java sources, the Java Dockerfiles -- runs the Java
  # tiers. go=true when go/**, this workflow, Dockerfile.replay-go (and its ignore file), the
  # replay smoke script or the race shard table changed. The jobs still RUN and succeed with their
  # steps skipped (not `skipped` as jobs), so ci-gate keeps requiring every job on a pull request.
  # A failure here skips its dependants, which fails ci-gate on a pull request. go-fixtures keeps
  # its own, wider detection. go_shards is the go-race matrix, from the shard table.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      java: ${{ steps.changes.outputs.java }}
      go: ${{ steps.changes.outputs.go }}
      go_shards: ${{ steps.shards.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          fetch-depth: 0

      - name: Detect Java- and Go-relevant changes
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ] || [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            echo "java=true" >> "$GITHUB_OUTPUT"
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            # Capture the whole list first: a git failure then fails the step (set -e) instead of
            # reading as "Go-only". An empty diff also runs everything.
            # --no-renames: a rename reports only its destination, so moving a Java file under go/
            # would otherwise read as Go-only. Listing both paths keeps the source path visible.
            changed=$(git diff --no-renames --name-only "$BASE" HEAD)
            if [ -z "$changed" ] || grep -vE '^(go/|Dockerfile\.replay-go)' >/dev/null <<<"$changed"; then
              echo "java=true" >> "$GITHUB_OUTPUT"
            else
              echo "java=false" >> "$GITHUB_OUTPUT"
            fi
            # grep reads every line rather than exiting at the first match while git still writes
            # (the list is captured above, so no SIGPIPE can turn a match into go=false).
            if [ -z "$changed" ] || grep -E '^(go/|\.github/workflows/ci\.yml$|Dockerfile\.replay-go|scripts/ci/smoke-replay-container\.sh$|scripts/ci/go-race-shards\.sh$)' >/dev/null <<<"$changed"; then
              echo "go=true" >> "$GITHUB_OUTPUT"
            else
              echo "go=false" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "changes: $(cat "$GITHUB_OUTPUT")"

      # Always computed: go-race expands it before its steps can skip. When go=false it is one
      # step-skipped leg on ubuntu-latest, not every shard's (arm64) runner.
      - name: Go race shard matrix
        id: shards
        env:
          GO_CHANGED: ${{ steps.changes.outputs.go }}
        run: |
          set -euo pipefail
          if [ "$GO_CHANGED" = true ]; then
            matrix=$(./scripts/ci/go-race-shards.sh --matrix)
          else
            matrix='[{"shard":"off","runner":"ubuntu-latest"}]'
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "go-race shards: $matrix"

  # Fast gate: unit / property / concurrency tiers only (no Docker). First to report on
  # every PR. Integration (Testcontainers/LocalStack) tiers are excluded here via
  # -PnoIntegration so this job stays ~1 min and says something useful early; they run
  # in the separate integration-tests job below, which gates the PR alongside this one.
  fast-tests:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - name: Instrumentation-drift guard (§5)
        if: needs.changes.outputs.java == 'true'
        run: ./scripts/ci/check-instrumentation-drift.sh

      # The guard itself is 1400+ lines of structural resolution logic (dataflow tracing,
      # a TypeIndex over records/coded-enums, correlated-pair recursion) that a future
      # refactor of the SCRIPT could quietly break without ever touching the Java it
      # checks -- so its own self-test suite (scratch trees with injected drift/false
      # positives) runs here too, not just on a maintainer's local machine. Fast and
      # hermetic (builds its own temp trees; no repo Java is scanned), so this costs the
      # job almost nothing.
      - name: Instrumentation-drift guard self-test (§5)
        if: needs.changes.outputs.java == 'true'
        run: ./scripts/ci/check-instrumentation-drift.sh --self-test

      # The image policy parses an external tool's JSON and resolves Ubuntu USN groups to
      # their member CVE priorities. Synthetic fixtures keep that fail-closed boundary under
      # the per-commit gate without downloading a scanner database or building an image.
      - name: OSV image-policy self-test
        if: needs.changes.outputs.java == 'true'
        run: python3 ./scripts/ci/osv-image-policy.py --self-test

      - name: Set up JDK 25
        if: needs.changes.outputs.java == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v4
        with:
          distribution: temurin
          java-version: "25"

      # `gradle/wrapper/gradle-wrapper.jar` is the one binary this repository ships, and it
      # executes before any other gate can run. Validate its checksum against the published
      # Gradle releases so a tampered wrapper cannot bootstrap the build.
      - name: Validate Gradle wrapper
        if: needs.changes.outputs.java == 'true'
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v6.4.0

      - name: Set up Gradle
        if: needs.changes.outputs.java == 'true'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v6.4.0

      # The CLI jar and replay installDist are built here so docker-publish ships the EXACT
      # artifacts that passed this job's tests — "test what you built".
      - name: Build + fast tests (no integration) + container artifacts
        if: needs.changes.outputs.java == 'true'
        run: ./gradlew build -PnoIntegration :swath-cli:shadowJar :swath-replay:installDist --no-daemon --stacktrace

      # Dependency-license gate: fails if any distributed (runtimeClasspath) dependency
      # carries a license not on config/license/allowed-licenses.json — e.g. a new
      # GPL/AGPL-only transitive dep. See THIRD_PARTY_NOTICES.md. Fast + no Docker, so
      # it belongs on the PR gate.
      - name: License compliance gate (allow-list)
        if: needs.changes.outputs.java == 'true'
        run: ./gradlew checkLicense --no-daemon --stacktrace

      # On main/manual runs, publish the tested uber-jar so docker-publish can ship THIS
      # artifact (the one that just passed the fast tier + license gate) instead of a third
      # from-source recompile inside the Docker build. docker-publish promotes it via a
      # BuildKit --build-context override of the Dockerfile's `build` stage — ship exactly
      # what was tested. PR runs do not publish an image, so they do not need this artifact.
      - name: Prepare container-promotion payload
        if: (github.event_name != 'pull_request') && needs.changes.outputs.java == 'true'
        run: ./scripts/ci/prepare-container-promotion.sh promote

      - name: Upload checked container-promotion payload
        if: (github.event_name != 'pull_request') && needs.changes.outputs.java == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: swath-container-payload
          path: promote.tar
          if-no-files-found: error
          retention-days: 1

      - name: Upload test reports
        if: always() && needs.changes.outputs.java == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: test-reports-fast
          # Test reports now live per-module (swath-model/build/reports/tests/, ...),
          # not under a single root build/.
          path: "*/build/reports/tests/"
          if-no-files-found: ignore

  # Slow tier: Docker/LocalStack integration tests. Runs on every event, PRs included:
  # real-store coverage that only runs after merge cannot block the bad merge, and at
  # ~170 s this tier is affordable on the PR gate (`ci-gate` needs it). Revisit once the
  # HAR-driven replay corridor lets these 13 LocalStack ITs retire (WP6.8). It also gates
  # the image publish (docker-publish `needs` it), so it must run on every event that can
  # publish; otherwise a skipped `needs` would silently skip the publish. Docker is on the
  # ubuntu-latest runner.
  integration-tests:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - name: Set up JDK 25
        if: needs.changes.outputs.java == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        if: needs.changes.outputs.java == 'true'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v6.4.0

      # INT-6 reads swath's Parquet parts back with DuckDB (an independent engine).
      # Without the CLI on PATH the test aborts (skips), so the DuckDB-readback
      # acceptance would pass vacuously -- install it so the reader actually runs.
      - name: Install DuckDB CLI
        if: needs.changes.outputs.java == 'true'
        run: |
          curl -fsSL https://github.com/duckdb/duckdb/releases/download/v1.1.3/duckdb_cli-linux-amd64.zip -o /tmp/duckdb.zip
          echo "efd0fccdb1a28d9ec7a6ebfcde59900068b8ba43a846c9b553c0fd2bbe4acf43  /tmp/duckdb.zip" | sha256sum --check -
          unzip -o /tmp/duckdb.zip -d /tmp/duckdb
          sudo install /tmp/duckdb/duckdb /usr/local/bin/duckdb
          duckdb --version

      # Integration tier ONLY (Docker/LocalStack ITs). -PonlyIntegration runs just the
      # @Tag("integration") classes, so this job no longer recompiles-and-re-runs the entire
      # fast tier that `fast-tests` already ran on the same commit. The fast tier's
      # compile + unit/property/concurrency suite is the fast-tests job's responsibility; here
      # we compile (unavoidable on a separate runner) and execute only the ~8 ITs.
      - name: Integration tests only (Docker/LocalStack tier)
        if: needs.changes.outputs.java == 'true'
        run: ./gradlew test -PonlyIntegration --no-daemon --stacktrace

      - name: Upload test reports
        if: always() && needs.changes.outputs.java == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: test-reports-integration
          path: "*/build/reports/tests/"
          if-no-files-found: ignore

  # Deep tier: schedule-sensitive probe-budget tests + latency-injecting retry/AIMD/throttle/
  # timeout tests, demoted OFF the per-commit fast gate (they are slow and/or flaky-under-
  # contention). Runs on `main` (merges) + dispatch — NOT on PRs, so a slow/flaky deep test
  # never blocks a PR — and again nightly (see nightly.yml). Runs SERIALLY (-PtestMaxParallelForks=1)
  # so the probe budgets are asserted without cross-fork CPU contention. Gates the publish.
  # The invariants these guard are pinned on every PR by fast deterministic smokes.
  deep-tests:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - name: Set up JDK 25
        if: needs.changes.outputs.java == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        if: needs.changes.outputs.java == 'true'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v6.4.0

      - name: Deep tier (schedule-sensitive + latency tests, serial)
        if: needs.changes.outputs.java == 'true'
        run: ./gradlew test -Pdeep -PtestMaxParallelForks=1 --no-daemon --stacktrace

      # A tag-filtered tier that matches nothing runs zero tests and reports green. Assert the
      # count instead of trusting it (see the script header for how the nightly job hid an
      # empty deep run for weeks).
      - name: Deep tier executed tests
        if: needs.changes.outputs.java == 'true'
        run: ./scripts/ci/report-test-counts.sh "deep tier"

      # The real `kill -9` -> `--resume` exactly-once path is env-gated
      # (`-Dswath.it.sigkill=true`, @EnabledIfSystemProperty) and SKIPPED everywhere else. A
      # separate, untagged invocation (not `-Pdeep`/`-PonlyIntegration`, which would tag-filter
      # it out) targets just this one class so it runs on every main-merge/dispatch alongside
      # the rest of the deep tier without widening what the fast/PR gate or the bulk
      # integration-tests job execute. Docker/Testcontainers (LocalStack) -- ubuntu-latest ships
      # Docker, no extra setup step needed.
      - name: Real kill -9 -> --resume exactly-once
        if: needs.changes.outputs.java == 'true'
        run: ./gradlew :swath-cli:test --tests "io.varve.swath.cli.HardCrashSigkillResumeProcessIT" -Dswath.it.sigkill=true --no-daemon --stacktrace

      # This IT is `@EnabledIfSystemProperty`-gated, so a break in the daemon-to-test-JVM
      # property forwarding turns it into a silent skip rather than a failure.
      - name: Kill -9 IT executed tests
        if: needs.changes.outputs.java == 'true'
        run: ./scripts/ci/report-test-counts.sh "kill -9 exactly-once IT" swath-cli

      # Parametric external-kill matrix (many lifecycle points x {no-sort, --sort}) ->
      # --resume -> identical-to-clean oracle. Same `-Dswath.it.sigkill=true` gate/tag as the
      # single-point IT above; separate untagged invocation for the same reason (a `-Pdeep`/
      # `-PonlyIntegration` run would tag-filter it out). Honest KILLED-vs-DEGRADED tally in output.
      - name: Real kill -9 matrix -> --resume identical-to-clean
        if: needs.changes.outputs.java == 'true'
        run: ./gradlew :swath-cli:test --tests "io.varve.swath.cli.HardCrashSigkillResumeMatrixIT" -Dswath.it.sigkill=true --no-daemon --stacktrace

      - name: Kill -9 matrix executed tests
        if: needs.changes.outputs.java == 'true'
        run: ./scripts/ci/report-test-counts.sh "kill -9 matrix IT" swath-cli

      - name: Upload test reports
        if: always() && needs.changes.outputs.java == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: test-reports-deep
          path: "*/build/reports/tests/"
          if-no-files-found: ignore

  # PR-only Docker build gate: validate the root Dockerfile builds multi-arch and
  # the image runs, on pull requests. It does NOT run on `main`/dispatch — there,
  # docker-publish builds+smokes+pushes the image itself, so a separate validation
  # build would just be a redundant second multi-arch build per merge. No push, no
  # credentials, no network — fork-safe.
  #
  # Named `docker-check`, not `docker-image`: it is a gate that builds and smokes
  # an image and throws it away, so the name says what it does rather than what it
  # touches, and pairs with `docker-publish` as validate/publish.
  #
  # Deliberately NO docker/setup-qemu-action: the runtime stage only pulls the
  # JRE base and COPYs the arch-neutral uber-jar (no RUN), so building the foreign
  # arch on this amd64 runner is pure pull+copy+metadata and needs no emulation.
  # That also makes this job a guard -- add a RUN to the runtime stage and the
  # arm64 build here starts needing QEMU and fails, flagging the regression.
  docker-check:
    if: github.event_name == 'pull_request'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile
            image: swath:ci
            cache_scope: swath
          - dockerfile: Dockerfile.replay
            image: swath-replay:ci
            cache_scope: swath-replay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - name: Set up Docker Buildx
        if: needs.changes.outputs.java == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build multi-arch image (validate both arches, no push)
        if: needs.changes.outputs.java == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          # ignore-error: a fork PR can't write the base repo's Actions cache
          # (read-only token) — degrade to a warning instead of failing the build.
          cache-to: type=gha,scope=${{ matrix.cache_scope }},mode=max,ignore-error=true

      - name: Build image (builder-native arch) + load for smoke
        if: needs.changes.outputs.java == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ matrix.image }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}

      - name: Smoke — image runs and entrypoint passes arguments
        if: needs.changes.outputs.java == 'true'
        run: docker run --rm "${{ matrix.image }}" --help

  # Go port (go/, see AGENTS.md "Go port"), in four jobs that run side by side, so a vet error
  # reports in a minute and the race tests' wall is their slowest shard instead of their sum
  # (one serial job took 17.5 min, internal/listing alone ~12 of it). Each always runs and does
  # its work only when changes.outputs.go is true, so Java-only changes pay a checkout and
  # nothing else. ci-gate needs every one: a job that did its work and failed, or one skipped on
  # a pull request, fails the gate.

  # The cheap verdicts first: formatting, vet, and the race shard table's own check (every
  # package and every test of a split package in exactly one shard).
  go-lint:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - name: Set up Go (version from go/go.mod)
        if: needs.changes.outputs.go == 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: gofmt
        if: needs.changes.outputs.go == 'true'
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt -l lists files that are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        if: needs.changes.outputs.go == 'true'
        run: go vet ./...

      - name: Race shards cover every test once
        if: needs.changes.outputs.go == 'true'
        run: ../scripts/ci/go-race-shards.sh --check

  # go test -race, one leg per row of scripts/ci/go-race-shards.sh (the changes job expands its
  # table into this matrix, so the table is the one place a shard is added). A leg's name is its
  # shard; the step prints the exact `go test` command to rerun it locally. fail-fast is off so
  # one red shard still lets the others report. go test's -timeout is per package binary, so it
  # is set to leave the job's limit room for setup, compiling and the packages queued ahead of
  # the last one (the whole `rest` shard takes ~6 min): a hang ends in go test's goroutine dump,
  # not a killed runner. -count=1: the restored build cache would otherwise replay a shard's
  # earlier results as `(cached)` instead of racing it. The -json stream is kept as the go-race-SHARD artifact (per-test
  # starts and times, passing subtests included) for flakes and rebalancing.
  go-race:
    needs: changes
    name: go-race (${{ matrix.shard }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.go_shards) }}
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - name: Set up Go (version from go/go.mod)
        if: needs.changes.outputs.go == 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: go test -race (shard ${{ matrix.shard }})
        if: needs.changes.outputs.go == 'true'
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          # Captured first, so a failing script fails the step instead of running no arguments.
          shard_args=$(../scripts/ci/go-race-shards.sh "$SHARD")
          mapfile -t args <<<"$shard_args"
          printf 'go test -race -count=1 -timeout 20m'; printf " '%s'" "${args[@]}"; echo
          json="$RUNNER_TEMP/go-race.json"
          # The log shows each package's own output live (its ok/FAIL line, a timeout's dump), then
          # the output of every failed test; the full stream is the artifact.
          set +e
          go test -race -count=1 -timeout 20m -json "${args[@]}" | tee "$json" |
            jq --unbuffered -rj 'select(.Action == "output" and .Test == null) | .Output'
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::group::output of the failed tests"
            jq -rjs '(map(select(.Action == "fail" and .Test != null) | [.Package, .Test]) | unique) as $failed
              | .[] | select(.Action == "output" and .Test != null and ([.Package, .Test] as $k | $failed | index([$k])))
              | .Output' "$json"
            echo "::endgroup::"
          fi
          exit "$status"

      - name: Upload the go test -json stream
        if: always() && needs.changes.outputs.go == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: go-race-${{ matrix.shard }}
          path: ${{ runner.temp }}/go-race.json
          if-no-files-found: ignore

  # The tests that measure the process and so must not run under -race, which distorts heap and
  # time: each opted in by its own gate, one step per tier.
  go-nonrace:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - name: Set up Go (version from go/go.mod)
        if: needs.changes.outputs.go == 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      # The writer admission's heap gate (go/docs/testing.md): its full arms allocate hundreds of
      # MiB and measure the live heap, which -race distorts, so they run here without it, opted in.
      - name: Heap gates (SWATH_HEAP_GATES=1, no -race)
        if: needs.changes.outputs.go == 'true'
        env:
          SWATH_HEAP_GATES: "1"
        run: go test -count=1 -timeout 15m -run '^TestWriterAdmissionCoversHeap$' ./internal/listing

      # The shape suite at 200,000 keys per shape (internal/shapes, go/docs/testing.md): a
      # measurement with order-of-magnitude bounds, skipped under -race (ten times slower, and the
      # code it drives is race-tested by its own packages), so it runs here without it.
      - name: Shape suite (TestShapes, no -race)
        if: needs.changes.outputs.go == 'true'
        run: go test -count=1 -timeout 15m -run '^TestShapes$' ./internal/shapes

  # Artifacts, independent of the tests: static cross-builds of both commands, the journal's
  # Windows test compile, and the Go replay image built and smoked.
  go-build:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - name: Set up Go (version from go/go.mod)
        if: needs.changes.outputs.go == 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Static cross-builds (CGO_ENABLED=0)
        if: needs.changes.outputs.go == 'true'
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            for cmd in swath swath-replay; do
              echo "building $cmd for $target"
              GOOS="${target%/*}" GOARCH="${target#*/}" SWATH_REVISION="$GITHUB_SHA" \
                ./build.sh -o "$RUNNER_TEMP/$cmd-${target%/*}-${target#*/}" "./cmd/$cmd"
            done
          done
          # The journal's tests (its Windows lock test included) compile for
          # Windows, where they are never run.
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go test -c -o "$RUNNER_TEMP/journal-windows.test" ./internal/journal
          # Each CI build names its commit (build.sh stamps it).
          for cmd in swath swath-replay; do
            "$RUNNER_TEMP/$cmd-linux-amd64" --version | tee /dev/stderr | grep -q "$GITHUB_SHA"
          done

      # The Go replay image, built like docker-check builds the Java ones: both architectures
      # (no push), then the builder-native one loaded for the smoke. No QEMU: the build stage
      # cross-compiles and the scratch runtime stage has no RUN, so the arm64 build here also
      # guards against a runtime stage that would need emulation.
      - name: Set up Docker Buildx
        if: needs.changes.outputs.go == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build Go replay image (both architectures, no push)
        if: needs.changes.outputs.go == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile.replay-go
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: SWATH_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=swath-replay-go
          # ignore-error: a fork PR can't write the base repo's Actions cache.
          cache-to: type=gha,scope=swath-replay-go,mode=max,ignore-error=true

      - name: Build Go replay image (builder-native arch) + load for smoke
        if: needs.changes.outputs.go == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile.replay-go
          load: true
          tags: swath-replay-go:ci
          build-args: SWATH_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=swath-replay-go

      # Two smokes, both on fixtures written here, so they need no network, no Java and no
      # recording. The Go lister's dataset of a fake bucket (bench/s3fake) is sorted, so the
      # server opens it as it is. The unsorted capture from bench/replay/capture is refused as
      # not servable sorted, so the smoke's fallback sorts it with the image's own sort-fixture
      # first; the step requires that the fallback ran.
      - name: Smoke — Go replay image serves a Go lister dataset and a sorted capture
        if: needs.changes.outputs.go == 'true'
        run: |
          set -euo pipefail
          docker run --rm swath-replay-go:ci --version | tee /dev/stderr | grep -q "$GITHUB_SHA"
          smoke="$RUNNER_TEMP/replay-smoke"
          mkdir -p "$smoke"
          go build -o "$smoke/s3fake" ./bench/s3fake
          awk 'BEGIN { for (i = 0; i < 2000; i++) printf "logs/p%02d/obj-%05d.json\t%d\n", i % 37, i, 1767225600000000 + i * 1000000 }' >"$smoke/keys.tsv"
          "$smoke/s3fake" -keys "$smoke/keys.tsv" -bucket smoke -addr 127.0.0.1:19400 &
          fake=$!
          trap 'kill "$fake"' EXIT
          for _ in $(seq 80); do curl -fs -o /dev/null http://127.0.0.1:19400/smoke && break; sleep 0.25; done
          "$RUNNER_TEMP/swath-linux-amd64" list s3://smoke -endpoint http://127.0.0.1:19400 -path-style -anonymous \
            -o "$smoke/dataset"
          ../scripts/ci/smoke-replay-container.sh swath-replay-go:ci "$smoke/dataset" sorted
          go run ./bench/replay/capture -rows 2000 -o "$smoke/capture"
          ../scripts/ci/smoke-replay-container.sh swath-replay-go:ci "$smoke/capture" sorted 2>&1 |
            tee "$smoke/capture-smoke.log"
          grep -q "sorting it with the image's sort-fixture" "$smoke/capture-smoke.log"

  # The Go default tier on the other operating systems the port ships for: plain `go test`
  # (no -race: slow on macOS, and the Windows race detector needs cgo) on macOS and Windows.
  # linux/arm64 is covered by the go-race shards. Only vet and the tests: gofmt, the shard
  # check, the heap gates, the cross-builds and the image stay in the jobs above. Always runs;
  # its steps work only on a Go-relevant change (the changes job).
  go-xos:
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - name: Set up Go (version from go/go.mod)
        if: needs.changes.outputs.go == 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: go vet
        if: needs.changes.outputs.go == 'true'
        run: go vet ./...

      - name: go test (no -race)
        if: needs.changes.outputs.go == 'true'
        run: go test -count=1 -timeout 25m ./...

  # The Go replay's fixture tier: the store's tests on fixtures the Java replay distribution
  # writes (bench/replay/make-fixtures.sh: DuckDB captures sorted by the Java sort-fixture),
  # gated in the tests on SWATH_REPLAY_FIXTURES and skipped everywhere else. A separate job, so
  # the Gradle build runs beside the Go jobs rather than inside its budget. Same always-runs,
  # works-on-change shape as the Go jobs. Its inputs are wider: the Java replay module and the
  # modules it builds on (swath-core, swath-model), the shared Gradle build and wrapper, the
  # evidence archive and expectations the tests read, and the replay smoke script.
  go-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          fetch-depth: 0

      - name: Detect Go changes
        id: changes
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ] || [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            # Capture the whole list first: a git failure then fails the step (set -e) instead of
            # reading as "no Go change", and grep reads every line rather than exiting at the
            # first match while git still writes (git's SIGPIPE under pipefail would turn a
            # match into go=false).
            changed=$(git diff --no-renames --name-only "$BASE" HEAD)
            if grep -E '^(go/|\.github/workflows/ci\.yml$|swath-replay/|swath-core/|swath-model/|docs/replay-provider-(evidence\.tar\.gz|expectations\.json)$|build\.gradle\.kts$|settings\.gradle\.kts$|gradle\.properties$|gradle/|build-logic/|gradlew$|scripts/ci/smoke-replay-container\.sh$)' >/dev/null <<<"$changed"; then
              echo "go=true" >> "$GITHUB_OUTPUT"
            else
              echo "go=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Set up Go (version from go/go.mod)
        if: steps.changes.outputs.go == 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Set up JDK 25
        if: steps.changes.outputs.go == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v4
        with:
          distribution: temurin
          java-version: "25"

      # This job runs the wrapper itself, so it validates it itself (see fast-tests).
      - name: Validate Gradle wrapper
        if: steps.changes.outputs.go == 'true'
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v6.4.0

      - name: Set up Gradle
        if: steps.changes.outputs.go == 'true'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v6.4.0

      - name: Java replay distribution
        if: steps.changes.outputs.go == 'true'
        working-directory: .
        run: ./gradlew --no-daemon --stacktrace :swath-replay:installDist

      - name: Java-written replay fixtures
        if: steps.changes.outputs.go == 'true'
        run: |
          set -euo pipefail
          PATH="$GITHUB_WORKSPACE/swath-replay/build/install/swath-replay/bin:$PATH" \
            bench/replay/make-fixtures.sh "$RUNNER_TEMP/replay-fixtures/fixtures"

      # FIXTURE_PACKAGES and FIXTURE_TESTS select the gated tests this tier runs; a new gated
      # test is added to both. Every named test must run and pass: a name that matches nothing,
      # or a test that skips (the gate it reads unset), would otherwise pass vacuously.
      - name: Gated replay tests on the Java-written fixtures
        if: steps.changes.outputs.go == 'true'
        env:
          SWATH_REPLAY_FIXTURES: ${{ runner.temp }}/replay-fixtures
          FIXTURE_PACKAGES: ./internal/replay/store ./internal/replay/evidence ./internal/replay/azure
          FIXTURE_TESTS: >-
            TestJavaWrittenFixtures
            TestSortsTheAzureEvidenceCorpus
            TestStartupCost
            TestSortFixtureMemory
            TestGCSNativeCapturesMatchReplay
            TestEvidenceRejectsCorruptedReplayResults
            TestAzureEvidenceReplay
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/fixture-tests.log"
          # shellcheck disable=SC2086 # FIXTURE_PACKAGES is a word list.
          go test -count=1 -v -run "^($(tr ' ' '|' <<<"$FIXTURE_TESTS"))\$" $FIXTURE_PACKAGES | tee "$log"
          if grep -q -- '--- SKIP' "$log"; then
            echo "::error::a fixture-tier test skipped"
            exit 1
          fi
          # The Azure evidence replay falls back to the manifest in memory when the Java-written
          # capture under the fixture root is missing; here the capture is the point, so that
          # fallback fails the tier. (The Azure corruption test serves from memory by design and
          # logs the root-less path, which this does not match.)
          if grep -qF "no $SWATH_REPLAY_FIXTURES/fixtures/evidence-azure/capture:" "$log"; then
            echo "::error::the Azure evidence replay did not use fixtures/evidence-azure/capture"
            exit 1
          fi
          want=$(tr ' ' '\n' <<<"$FIXTURE_TESTS" | sort -u)
          ran=$(sed -n 's/^--- PASS: \([^ ]*\) .*/\1/p' "$log" | sort -u)
          if [ "$ran" != "$want" ]; then
            echo "::error::fixture-tier tests that did not run: $(comm -23 <(echo "$want") <(echo "$ran") | paste -sd' ' -)"
            exit 1
          fi

  # The single required status check on `main`, and the only job here that exists for the
  # branch rule rather than for what it runs.
  #
  # GitHub can only require a check by NAME, and a matrix job expands into one context per leg
  # (`docker-check (Dockerfile, swath:ci, swath)`, ...): a rule naming `docker-check` matches
  # nothing, and naming the legs individually goes stale the moment a leg is added or renamed.
  # One aggregate job has a single stable name, and `needs` already collapses every leg of a
  # matrix into one result — so adding a leg extends the gate for free. Requiring the tiers
  # individually has a second failure mode this avoids: a single-module `check` once reported a
  # cross-module change green (08-19), and a rule listing job names cannot notice that.
  #
  # `if: always()` is not optional. Without it a failed dependency SKIPS this job, a skipped
  # required check never reports a conclusion, and the pull request waits forever instead of
  # going red.
  ci-gate:
    needs: [changes, fast-tests, integration-tests, docker-check, go-lint, go-race, go-nonrace, go-build, go-xos, go-fixtures]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A skipped dependency passes the gate only OFF pull_request, where jobs are legitimately
      # event-gated (docker-check is PR-only, so it skips on every main merge). On a pull request
      # every dependency runs (the Java and Go jobs do their work only when their inputs changed), so there `skipped` is not a pass: that is what stops a future
      # `if:` from quietly removing a tier from the gate while the check stays green.
      - name: Every gating job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          ALLOW_SKIPPED: ${{ github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          if [ "$ALLOW_SKIPPED" = true ]; then
            allowed='["success","skipped"]'
          else
            allowed='["success"]'
          fi
          {
            echo "### CI gate"
            echo
            echo "| job | result |"
            echo "| --- | --- |"
            jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<<"$NEEDS"
          } >> "$GITHUB_STEP_SUMMARY"
          failed=$(jq -r --argjson allowed "$allowed" \
            'to_entries[] | select(.value.result as $r | $allowed | index($r) | not) | .key' <<<"$NEEDS")
          if [ -n "$failed" ]; then
            echo "::error::CI gate failed — not passing: $(echo "$failed" | paste -sd', ' -)"
            exit 1
          fi
          echo "CI gate passed."

  # Dev-image GHCR publish + deep runtime smoke. Runs on every `main` merge that touches Java and on
  # manual dispatch from any branch. Tagged releases publish through release.yml
  # instead; `latest` and the semver tags are owned solely by that workflow, so this
  # job can never regress a release pointer.
  #
  # Running on merges is what gives `main` any Docker coverage at all: docker-check
  # is PR-only, so without this a merge would build no image, and a break that only
  # appears in the merge result (a semantic conflict between two green PRs, a RUN
  # added to the runtime stage) would stay invisible until someone cut a tag.
  #
  # Gated on ALL test jobs (`needs` fast-tests + integration-tests + deep-tests), so an image
  # is never published from code that fails any tier. It also promotes the tested uber-jar
  # from fast-tests into the image (see the build-context step below) rather than recompiling.
  # Pushes the multi-arch manifest to this repository's GHCR namespace via the
  # built-in GITHUB_TOKEN. Package visibility is managed in the repository/package
  # settings; the workflow itself does not assume private or public visibility.
  docker-publish:
    needs: [changes, fast-tests, integration-tests, deep-tests]
    # A Go-only merge publishes no Java image: `main` stays on the last Java-changing commit.
    if: >-
      needs.changes.outputs.java == 'true'
      && (github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    # Serialize ALL publishes globally (main + any dispatched branch share this one
    # group) so two publishes can never race the shared GHCR tags (main/sha-).
    # cancel-in-progress: false — never kill a publish mid-push; queue instead. If
    # publishes stack, only a superseded commit's *publish* is dropped (its tests
    # still ran, since the test jobs are not in this group), and the `main`/`sha-`
    # tags still converge to the newest commit.
    concurrency:
      group: ghcr-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # Download the EXACT uber-jar that passed fast-tests and lay it out at the path the
      # Dockerfile's `build` stage emits (/src/swath-cli/build/libs/swath.jar). The
      # `build-contexts: build=promote` below then substitutes this directory for the
      # Dockerfile's compile-from-source `build` stage, so the image ships the tested bytes
      # and skips a third Gradle compile. Local `docker build .` is unaffected (no override).
      # NOTE: the promote layout mirrors the Dockerfile's `COPY --from=build /src/...` path —
      # keep them in sync if that COPY path ever changes.
      - name: Download checked container-promotion payload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: swath-container-payload
          path: promotion-download

      - name: Restore and verify container-promotion payload
        run: ./scripts/ci/unpack-container-promotion.sh promotion-download/promote.tar promote

      # Smoke BEFORE push: build the builder-native-arch image, run the deep runtime smoke,
      # and only push if it passes — so a shading/exclude/runtime regression can
      # never reach the GHCR tags (`branch`/`sha-`).
      - name: Build image (builder-native arch) + load for deep smoke
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          build-contexts: |
            build=promote
          load: true
          tags: swath:ci
          cache-from: type=gha,scope=swath
          cache-to: type=gha,scope=swath,mode=max

      - name: Build replay image (builder-native arch) + load for smoke
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile.replay
          build-contexts: |
            build=promote
          load: true
          tags: swath-replay:ci
          cache-from: type=gha,scope=swath-replay
          cache-to: type=gha,scope=swath-replay,mode=max

      - name: Smoke — replay toolkit launcher and runtime classpath
        run: docker run --rm swath-replay:ci --help

      - name: Install DuckDB CLI
        run: |
          curl -fsSL https://github.com/duckdb/duckdb/releases/download/v1.1.3/duckdb_cli-linux-amd64.zip -o /tmp/duckdb.zip
          echo "efd0fccdb1a28d9ec7a6ebfcde59900068b8ba43a846c9b553c0fd2bbe4acf43  /tmp/duckdb.zip" | sha256sum --check -
          unzip -o /tmp/duckdb.zip -d /tmp/duckdb
          sudo install /tmp/duckdb/duckdb /usr/local/bin/duckdb
          duckdb --version

      # Deep runtime smoke (shared with release.yml — see the script header). Runs
      # only here on non-PR events, so a network hiccup never blocks a PR. Gates the
      # push below: a shading/exclude/runtime regression can never reach the GHCR tags.
      - name: Smoke — container Parquet write + read + resume (public bucket)
        run: ./scripts/ci/smoke-container.sh swath:ci dockersmoke
        env:
          SWATH_SMOKE_BUCKET: ${{ vars.SWATH_SMOKE_BUCKET }}

      - name: Smoke — replay serves the captured Parquet through DuckDB and Jetty
        run: ./scripts/ci/smoke-replay-container.sh swath-replay:ci dockersmoke/data/data

      # Only now — after the smoke passed — log in and push the multi-arch
      # manifest to this repository's GHCR namespace.
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels + annotations)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        env:
          # Emit OCI annotations at the INDEX level too (default is manifest-only).
          # A multi-arch push renders its top-level image INDEX in the GHCR package
          # page; without index annotations, org.opencontainers.image.{source,
          # description,…} live only inside the per-arch config blobs (via `labels`),
          # which GHCR's UI/repo-auto-link don't read — so the package shows a bare
          # digest list. Index+manifest annotations give GHCR the repo link + desc.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest
        with:
          images: ghcr.io/${{ github.repository }}
          # Dev images only. The mutable `latest` tag belongs to published releases
          # and is owned solely by release.yml, so a dev publish can never regress
          # it to an unversioned main build.
          #
          # `sha-<gitsha>` is emitted for every publish — immutable and bisectable,
          # and enough to pull any branch's image for testing.
          #
          # The branch-name tag is deliberately restricted to `main`. A dispatch can
          # run on ANY ref, and type=ref,event=branch would otherwise paint the
          # branch name onto a public registry: dispatching `sim/streaming-tier`
          # would publish ghcr.io/varveio/swath:sim-streaming-tier, leaking internal
          # branch names to anyone listing the package. That was harmless while the
          # repository was private; it is not now.
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Replay image metadata (tags + labels + annotations)
        id: replay-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest
        with:
          images: ghcr.io/${{ github.repository }}-replay
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch,enable=${{ github.ref == 'refs/heads/main' }}

      # Provenance note: the deep smoke above ran the `--load`ed builder-native amd64 image;
      # this step rebuilds the multi-arch manifest from the SAME build cache in the
      # SAME job seconds later, so the pushed amd64 is effectively the smoked amd64.
      # Two residual facts, accepted as low-risk for an arch-neutral RUN-free jar:
      # (1) if the BuildKit cache ever misses between the two builds, shadowJar is
      #     not guaranteed byte-reproducible, so the pushed bytes could differ;
      # (2) arm64 is validated to build + start but is NOT runtime-smoked (no arm64
      #     runner / no QEMU) — it is the same arch-neutral jar on the arm64 JRE.
      # Exact image-digest promotion would require build-once → smoke →
      # `imagetools create`; the current workflow instead promotes the exact tested
      # jar and rebuilds the image manifest from the same cache.
      - name: Build + push multi-arch image to GHCR
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          # Promote the SAME tested uber-jar (see the smoke build above): substitute the
          # Dockerfile's compile-from-source `build` stage with the prebuilt jar. The jar is
          # arch-neutral bytecode, so one artifact serves both linux/amd64 and linux/arm64.
          build-contexts: |
            build=promote
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # OCI annotations on the index/manifest (not just the per-arch config
          # `labels` above) so the GHCR package page shows the description and
          # auto-links back to this repo for the multi-arch manifest.
          annotations: ${{ steps.meta.outputs.annotations }}
          # Provenance kept ON (buildx default): the extra `unknown/unknown` entry in
          # the GHCR package is the SLSA build-provenance attestation manifest (a
          # supply-chain attestation, NOT a broken arch — it references the real
          # amd64/arm64 images and is ignored by `docker pull`/`run`. Set
          # `provenance: false` here to drop it.
          cache-from: type=gha,scope=swath
          cache-to: type=gha,scope=swath,mode=max

      - name: Build + push multi-arch replay image to GHCR
        id: replay-build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile.replay
          build-contexts: |
            build=promote
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.replay-meta.outputs.tags }}
          labels: ${{ steps.replay-meta.outputs.labels }}
          annotations: ${{ steps.replay-meta.outputs.annotations }}
          cache-from: type=gha,scope=swath-replay
          cache-to: type=gha,scope=swath-replay,mode=max

      # Surface the pushed manifest's digest so consumers can pin
      # `ghcr.io/…@sha256:…` without relying on a mutable tag.
      - name: Report pushed image digest
        run: |
          {
            echo "### swath images pushed to GHCR"
            echo '```'
            echo "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"
            echo "ghcr.io/${{ github.repository }}-replay@${{ steps.replay-build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
