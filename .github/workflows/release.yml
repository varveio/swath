name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: public-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Release guard self-tests
        run: |
          ./scripts/ci/release-assets.sh --self-test
          ./scripts/ci/verify-release-source.sh --self-test
          python3 scripts/ci/test-release-go-ci.py
          ./scripts/ci/verify-release-notes.sh --self-test

      # Ancestor, rather than equality with origin/main: `just release` tags a commit already
      # on main, and main may have moved on by the time the tag is pushed.
      - name: Verify tag SHA and origin/main ancestry
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+${GITHUB_REF}:refs/remotes/release/event-tag" \
            +refs/heads/main:refs/remotes/origin/main
          ./scripts/ci/verify-release-source.sh \
            "$GITHUB_SHA" refs/remotes/release/event-tag refs/remotes/origin/main

      - name: Require full Go validation of the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/verify-release-go-ci.py "$GITHUB_SHA"

      # The tag is the version's one source: build.sh stamps it into every binary, and the
      # archive names, image tags and labels all read this output. verify-release-notes.sh
      # rejects any other shape than X.Y.Z or X.Y.Z-rc.N.
      - id: version
        name: Read the version from the tag and verify the human release notes
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          ./scripts/ci/verify-release-notes.sh "$version" docs/ops/dev/RELEASE_NOTES.md
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  # The Go gate on the tag SHA: vet and the race tests of the main module and of the reader
  # module it compiles in (go.mod replaces it with ./reader). The source job separately
  # requires main CI's full Go gate at this SHA; this reruns the suite that guards
  # what ships, unsharded on amd64 as nightly's go-race-nightly does, from a cold cache.
  go-tests:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Assert exact tag SHA checkout
        run: test "$(git rev-parse HEAD)" = "$(git rev-parse "${GITHUB_SHA}^{commit}")"

      # actions/setup-go@v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go/go.mod
          cache: false

      - name: go vet
        run: |
          go vet ./...
          (cd reader && go vet ./...)

      # -timeout is per package binary and leaves the job's limit room for the packages queued
      # ahead of the last (the unsharded run took ~13 min), so a hang ends in a goroutine dump.
      - name: go test -race ./... (unsharded, amd64)
        run: |
          set -euo pipefail
          json="$RUNNER_TEMP/go-race-release.json"
          set +e
          go test -race -count=1 -timeout 40m -json ./... | tee "$json" |
            jq --unbuffered -rj 'select(.Action == "output" and .Test == null) | .Output'
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::group::output of the failed tests"
            jq -rjs '(map(select(.Action == "fail" and .Test != null) | [.Package, .Test]) | unique) as $failed
              | .[] | select(.Action == "output" and .Test != null and ([.Package, .Test] as $k | $failed | index([$k])))
              | .Output' "$json"
            echo "::endgroup::"
          fi
          exit "$status"

      - name: go test -race (reader module)
        working-directory: go/reader
        run: go test -race -count=1 -timeout 10m ./...

      - name: Upload the go test -json stream
        if: always()
        # actions/upload-artifact@v4
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: go-race-release
          path: ${{ runner.temp }}/go-race-release.json
          if-no-files-found: ignore
          retention-days: 30

  # Builds the release once: every target's binaries, stamped with the tag's version and
  # commit, and their third-party notices (go/notices.sh, which fails on a linked module whose
  # license is not allowed or not recognized), packed into the archives the release publishes,
  # with an SBOM of the binaries and SHA256SUMS. The publish job takes the images' binaries and
  # notices out of these archives.
  build:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Assert exact tag SHA checkout
        run: test "$(git rev-parse HEAD)" = "$(git rev-parse "${GITHUB_SHA}^{commit}")"

      # actions/setup-go@v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go/go.mod
          cache: false

      - name: Build every target (CGO_ENABLED=0, version and commit stamped) and the notices
        env:
          VERSION: ${{ needs.source.outputs.version }}
          SWATH_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          ./scripts/ci/release-assets.sh build "$VERSION" "$RUNNER_TEMP/release-bin"
          # What a user's --version prints is the tag's version and commit, exactly.
          for cmd in swath swath-replay; do
            got=$("$RUNNER_TEMP/release-bin/linux-amd64/$cmd" --version)
            want="$cmd $VERSION ($GITHUB_SHA)"
            echo "$got"
            test "$got" = "$want" || { echo "::error::$cmd --version is '$got', want '$want'"; exit 1; }
          done

      - name: Stage release assets
        env:
          VERSION: ${{ needs.source.outputs.version }}
        run: ./scripts/ci/release-assets.sh stage "$VERSION" "$RUNNER_TEMP/release-bin" release-assets

      # Syft reads each Go binary's embedded module list, so the SBOM names the modules
      # linked into every shipped binary, for every target, and no test-only module.
      - name: Generate SPDX SBOM from the shipped binaries
        # anchore/sbom-action@v0
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          path: ${{ runner.temp }}/release-bin
          format: spdx-json
          output-file: release-assets/swath-${{ needs.source.outputs.version }}.spdx.json
        # Without a source name syft names the SBOM's root package after the scanned
        # directory, a path on the runner.
        env:
          SYFT_SOURCE_NAME: swath
          SYFT_SOURCE_VERSION: ${{ needs.source.outputs.version }}

      - name: Write SHA256SUMS for release assets
        env:
          VERSION: ${{ needs.source.outputs.version }}
        run: ./scripts/ci/release-assets.sh checksums "$VERSION" release-assets

      # actions/upload-artifact@v4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-assets
          path: release-assets
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [source, go-tests, build]
    # Publishing requires the repository to be public AND the PUBLIC_RELEASE_ENABLED
    # variable, which stays in place as an emergency kill-switch: unset it and tags
    # build assets without publishing anything, no code change required.
    #
    # Operator note: this gate reads visibility from the TRIGGERING PUSH EVENT, so
    # re-running an old tag's workflow replays that tag's original payload. If a gate
    # input has changed since, push a FRESH tag rather than re-running.
    if: github.event.repository.visibility == 'public' && vars.PUBLIC_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: public-release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.source.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Assert exact tag SHA checkout
        run: test "$(git rev-parse HEAD)" = "$(git rev-parse "${GITHUB_SHA}^{commit}")"

      # actions/download-artifact@v4
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-assets
          path: release-assets

      # The images carry the archived bytes: Dockerfile.go's build stage is replaced by the
      # linux binaries out of the verified archives, so nothing is compiled a second time.
      - name: Verify release assets and unpack the image binaries
        run: |
          ./scripts/ci/release-assets.sh verify-unsigned "$VERSION" release-assets
          ./scripts/ci/release-assets.sh image-context "$VERSION" release-assets image-context

      # docker/setup-buildx-action@v3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      # docker/login-action@v3
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Classify the tag once; every downstream step reads these outputs rather than
      # re-deriving the rule. A pre-release publishes its own immutable X.Y.Z-rc.N tag
      # and nothing else: no `latest`, no rolling `X.Y`, and a GitHub pre-release. The
      # rehearsal must otherwise take exactly the same path as a real release —
      # signing, attestation, promotion, self-verification — or it rehearses nothing.
      - id: kind
        name: Classify the release
        run: |
          set -euo pipefail
          if [[ "$VERSION" == *-rc.* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "tags=ghcr.io/${GITHUB_REPOSITORY}:${VERSION}" >> "$GITHUB_OUTPUT"
            echo "replay_tags=ghcr.io/${GITHUB_REPOSITORY}-replay:${VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            # Rolling X.Y alongside the immutable X.Y.Z.
            tags="ghcr.io/${GITHUB_REPOSITORY}:${VERSION} ghcr.io/${GITHUB_REPOSITORY}:${VERSION%.*} ghcr.io/${GITHUB_REPOSITORY}:latest"
            # Bare major only from 1.0 onward. A `0` tag would imply a stability
            # contract 0.x explicitly disclaims, so the exception is implemented
            # here rather than left as a comment nobody remembers at 1.0.
            if [[ "${VERSION%%.*}" != 0 ]]; then
              tags="$tags ghcr.io/${GITHUB_REPOSITORY}:${VERSION%%.*}"
            fi
            echo "tags=$tags" >> "$GITHUB_OUTPUT"
            replay_tags="ghcr.io/${GITHUB_REPOSITORY}-replay:${VERSION} ghcr.io/${GITHUB_REPOSITORY}-replay:${VERSION%.*} ghcr.io/${GITHUB_REPOSITORY}-replay:latest"
            if [[ "${VERSION%%.*}" != 0 ]]; then
              replay_tags="$replay_tags ghcr.io/${GITHUB_REPOSITORY}-replay:${VERSION%%.*}"
            fi
            echo "replay_tags=$replay_tags" >> "$GITHUB_OUTPUT"
          fi

      # Push by DIGEST, with no tags attached yet. The tags are applied further down,
      # only after the smoke has run against this exact digest — so `latest` and
      # `X.Y.Z` name bytes that were actually executed, not a second build that is
      # merely expected to be identical. See the release-pipeline design note §2.1b.
      - id: image
        name: Build and push the image by digest (untagged)
        # docker/build-push-action@v6
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Dockerfile.go
          target: swath
          build-contexts: build=image-context
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          sbom: true
          provenance: mode=max

      - id: replay-image
        name: Build and push the replay image by digest (untagged)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Dockerfile.go
          target: swath-replay
          build-contexts: build=image-context
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=ghcr.io/${{ github.repository }}-replay,push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=swath listing replay server
          sbom: true
          provenance: mode=max

      # Checksum-verified before it runs. This job can publish, sign, attest and
      # release, so an unverified third-party binary executing here would be the
      # highest-privilege foothold in the pipeline.
      - name: Install DuckDB CLI
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/duckdb/duckdb/releases/download/v1.1.3/duckdb_cli-linux-amd64.zip -o /tmp/duckdb.zip
          echo "efd0fccdb1a28d9ec7a6ebfcde59900068b8ba43a846c9b553c0fd2bbe4acf43  /tmp/duckdb.zip" | sha256sum --check -
          unzip -o /tmp/duckdb.zip -d /tmp/duckdb
          sudo install /tmp/duckdb/duckdb /usr/local/bin/duckdb

      - name: Smoke — each pushed digest names the tag's version and commit
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          REPLAY_DIGEST: ${{ steps.replay-image.outputs.digest }}
        run: |
          set -euo pipefail
          for pair in "swath ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}" "swath-replay ghcr.io/${GITHUB_REPOSITORY}-replay@${REPLAY_DIGEST}"; do
            read -r cmd ref <<< "$pair"
            got=$(docker run --rm "$ref" --version)
            want="$cmd $VERSION ($GITHUB_SHA)"
            echo "$got"
            test "$got" = "$want" || { echo "::error::$ref --version is '$got', want '$want'"; exit 1; }
          done

      # The release image gets the same deep smoke go-build runs offline — literally the
      # same script — here against a real public bucket over HTTPS, and against the pushed
      # digest, so what is verified is exactly what the tags will name.
      - name: Smoke — Parquet write + read + resume against the pushed digest
        run: ./scripts/ci/smoke-container.sh "ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}" releasesmoke
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          SWATH_SMOKE_BUCKET: ${{ vars.SWATH_SMOKE_BUCKET }}

      - name: Smoke — replay serves the dataset the release image wrote
        run: >-
          ./scripts/ci/smoke-replay-container.sh
          "ghcr.io/${GITHUB_REPOSITORY}-replay@${REPLAY_DIGEST}"
          releasesmoke/data sorted
        env:
          REPLAY_DIGEST: ${{ steps.replay-image.outputs.digest }}

      # Only now do the tags exist. imagetools create copies no bytes: it points new
      # tags at the digest that was just smoked.
      - name: Apply release tags to the smoked digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          REPLAY_DIGEST: ${{ steps.replay-image.outputs.digest }}
          TAGS: ${{ steps.kind.outputs.tags }}
          REPLAY_TAGS: ${{ steps.kind.outputs.replay_tags }}
        run: |
          set -euo pipefail
          ARGS=()
          for tag in $TAGS; do ARGS+=(--tag "$tag"); done
          docker buildx imagetools create "${ARGS[@]}" "ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}"
          docker buildx imagetools inspect "ghcr.io/${GITHUB_REPOSITORY}:${VERSION}"
          REPLAY_ARGS=()
          for tag in $REPLAY_TAGS; do REPLAY_ARGS+=(--tag "$tag"); done
          docker buildx imagetools create "${REPLAY_ARGS[@]}" "ghcr.io/${GITHUB_REPOSITORY}-replay@${REPLAY_DIGEST}"
          docker buildx imagetools inspect "ghcr.io/${GITHUB_REPOSITORY}-replay:${VERSION}"

      - name: Install cosign
        # sigstore/cosign-installer@v3
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532

      # SHA256SUMS is signed LAST and deliberately: it is the one file whose integrity
      # transitively covers every other asset, so a consumer who verifies only its
      # signature and then runs `sha256sum --check` has covered the whole release.
      #
      # No COSIGN_EXPERIMENTAL: keyless has been GA since cosign 2.0 (2023) and the
      # variable is a no-op that only misleads readers.
      - name: Keylessly sign release assets and the image digests
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          REPLAY_DIGEST: ${{ steps.replay-image.outputs.digest }}
        run: |
          set -euo pipefail
          asset_list=$(./scripts/ci/release-assets.sh list-signable "$VERSION" release-assets)
          mapfile -t assets <<< "$asset_list"
          for asset in "${assets[@]}"; do
            cosign sign-blob --yes --bundle "${asset}.sigstore.json" "$asset"
          done
          cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}"
          cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY}-replay@${REPLAY_DIGEST}"
          ./scripts/ci/release-assets.sh verify-signed "$VERSION" release-assets

      # Attestations answer a different question from the signatures above: not "are
      # these the bytes that were signed" but "which workflow, in which repo, at which
      # commit, produced this" — SLSA v1.0 build provenance, verifiable with `gh
      # attestation verify` and no extra tooling on the user's side.
      # actions/attest-build-provenance@v4
      - name: Attest build provenance for the release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            release-assets/swath-${{ env.VERSION }}-*.tar.gz
            release-assets/swath-${{ env.VERSION }}-*.zip
            release-assets/SHA256SUMS

      # actions/attest-build-provenance@v4
      - name: Attest build provenance for the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      # actions/attest-build-provenance@v4
      - name: Attest build provenance for the replay image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ghcr.io/${{ github.repository }}-replay
          subject-digest: ${{ steps.replay-image.outputs.digest }}
          push-to-registry: true

      # The SBOM covers every target's binaries, so it is attested to every archive.
      # actions/attest-sbom@v4
      - name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e
        with:
          subject-path: |
            release-assets/swath-${{ env.VERSION }}-*.tar.gz
            release-assets/swath-${{ env.VERSION }}-*.zip
          sbom-path: release-assets/swath-${{ env.VERSION }}.spdx.json

      # Created as a DRAFT. `gh release create` publishes the release and then uploads
      # assets, so a failure mid-upload would otherwise leave a live, incomplete
      # release — and notify watchers about it. Draft first, verify, then un-draft.
      - name: Create the GitHub release as a draft
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.kind.outputs.prerelease }}
        run: |
          set -euo pipefail
          release_notes=$(<docs/ops/dev/RELEASE_NOTES.md)
          ARGS=(--draft --verify-tag --title "swath ${VERSION}" --generate-notes \
                --notes "$release_notes")
          if [[ "$PRERELEASE" == "true" ]]; then
            ARGS+=(--prerelease)
          fi
          asset_list=$(./scripts/ci/release-assets.sh list-release "$VERSION" release-assets)
          mapfile -t assets <<< "$asset_list"
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" "${ARGS[@]}"

      # Run the exact commands the docs tell users to run. If verification would fail
      # in a user's terminal, the release should be red here instead — a signature
      # nobody can verify is worse than no signature, because it invites trust. This
      # is also what makes the -rc rehearsal assert something rather than merely
      # execute.
      - name: Self-verify the published release
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.image.outputs.digest }}
          REPLAY_DIGEST: ${{ steps.replay-image.outputs.digest }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          # Verify what GitHub actually STORED, not the local copies we uploaded from.
          # Checking release-assets/ would re-confirm files we already know are good and
          # would miss a truncated or mis-uploaded asset — the failure this step exists
          # to catch. Download the draft's assets into a fresh directory and verify there.
          rm -rf release-verify
          gh release download "$GITHUB_REF_NAME" --dir release-verify

          ./scripts/ci/release-assets.sh verify-signed "$VERSION" release-verify

          echo "::group::checksums (downloaded copies)"
          (cd release-verify && sha256sum --check SHA256SUMS)
          echo "::endgroup::"

          echo "::group::cosign verify-blob (SHA256SUMS)"
          cosign verify-blob \
            --bundle release-verify/SHA256SUMS.sigstore.json \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            release-verify/SHA256SUMS
          echo "::endgroup::"

          echo "::group::cosign verify (image)"
          cosign verify \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}" > /dev/null
          cosign verify \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "ghcr.io/${GITHUB_REPOSITORY}-replay@${REPLAY_DIGEST}" > /dev/null
          echo "::endgroup::"

          echo "::group::gh attestation verify"
          gh attestation verify "oci://ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}" \
            --repo "$GITHUB_REPOSITORY"
          gh attestation verify "oci://ghcr.io/${GITHUB_REPOSITORY}-replay@${REPLAY_DIGEST}" \
            --repo "$GITHUB_REPOSITORY"
          gh attestation verify release-verify/SHA256SUMS --repo "$GITHUB_REPOSITORY"
          for archive in release-verify/swath-"${VERSION}"-*.tar.gz release-verify/swath-"${VERSION}"-*.zip; do
            gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY"
          done
          echo "::endgroup::"

      - name: Report published image digests
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          REPLAY_DIGEST: ${{ steps.replay-image.outputs.digest }}
        run: |
          {
            echo "### Release images"
            echo '```'
            echo "ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}"
            echo "ghcr.io/${GITHUB_REPOSITORY}-replay@${REPLAY_DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
