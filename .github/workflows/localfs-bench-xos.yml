name: localfs-bench-xos

# The local walker against fd and the platform's own tools on Windows (NTFS) and macOS (APFS).
# Runs on a push to the bench/localfs-xos branch, or by hand. Driver: go/bench/xos-bench.sh.
# Results: the job summary and the uploaded artifact.
on:
  push:
    branches: [bench/localfs-xos]
    paths: [go/bench/xos-bench.sh, go/bench/xos_arms.py, .github/workflows/localfs-bench-xos.yml]
  workflow_dispatch:
    inputs:
      ref_a:
        description: swath ref A (before)
        default: b8a8003ccffea2d2721484e9d2cc6664fd9ce8d0  # main before #368
      ref_b:
        description: swath ref B (after)
        default: f76045ad606ed29db6a03ad759f5429d81cff8ef  # main: #368, #372, #389, #399
      peer_rounds:
        default: "6"
      os:
        description: runners (JSON list)
        default: '["macos-latest"]'

permissions:
  contents: read

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os || '["macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 350
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {repository: varveio/swath, ref: "${{ inputs.ref_a || 'b8a8003ccffea2d2721484e9d2cc6664fd9ce8d0' }}", path: swath-a}
      - uses: actions/checkout@v4
        with: {repository: varveio/swath, ref: "${{ inputs.ref_b || 'f76045ad606ed29db6a03ad759f5429d81cff8ef' }}", path: swath-b}
      - uses: actions/setup-go@v5
        with: {go-version-file: swath-b/go/go.mod, cache: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: build
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          for v in a b; do (cd swath-$v/go && CGO_ENABLED=0 go build -o "$RUNNER_TEMP/bin/swath-$v$EXE" ./cmd/swath); done
        env:
          EXE: ${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install fd bfs
          pip install fdu || echo "fdu unavailable"
      - name: tools (Windows)
        if: runner.os == 'Windows'
        run: choco install -y --no-progress fd
      - name: bench
        run: |
          export PATH="$PATH:/c/ProgramData/chocolatey/bin"
          B="$RUNNER_TEMP/bin"
          if [ "$RUNNER_OS" = Windows ]; then B=$(cygpath -m "$B"); X=.exe; else X=; fi
          SWATH_A="$B/swath-a$X" SWATH_B="$B/swath-b$X" GEN=go/bench/gen_tree.py OUT="$RUNNER_TEMP/out" \
            PEER_ROUNDS="${{ inputs.peer_rounds || '6' }}" TREES="$TREES" ROUND_SCALE="$ROUND_SCALE" HUGE_FILES="$HUGE_FILES" \
            bash go/bench/xos-bench.sh
        env:
          # the macOS runner timed out (350 min) on all + huge: about 1M nested and 300k in one directory there
          TREES: ${{ runner.os == 'macOS' && 'realistic huge' || 'all huge' }}
          HUGE_FILES: ${{ runner.os == 'macOS' && '300000' || '1000000' }}
          ROUND_SCALE: ${{ runner.os == 'macOS' && '0.5' || '1' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: localfs-bench-${{ runner.os }}
          path: ${{ runner.temp }}/out
