name: Nightly deep verification

# What the per-commit gate cannot see, checked on a schedule: the tiers too slow or too
# timing-sensitive to run per commit, and the supply-chain scan, which goes red because time
# passed rather than because the commit changed.
#
# The deep + perf tiers are the tests demoted off the per-commit fast gate:
#   - `deep`: schedule-sensitive probe-budget tests + latency-injecting retry/AIMD/throttle
#             timing tests (also run on every main-merge via ci.yml's deep-tests job).
#   - `perf`: the heavy scale/throughput tier (100k–1M-key mock-driven PERF-1/PERF-2/SORT-PERF),
#             which is opt-in (-Pperf) and never runs per-commit.
# The per-commit fast gate pins the *invariants* these guard via fast deterministic smokes;
# this workflow is the exhaustive/timing-realistic backstop.
#
# go-race-nightly is the Go port's backstop: the race tests unsharded on amd64. go-xos-macos is
# the Go default tier on macOS, which ci.yml runs on main and dispatch but not on pull requests.
#
# ALERTING: a failure here (or a red deep-tests job on a main merge) means an invariant broke
# outside the per-commit gate — GitHub emails the default recipients on a failed scheduled run;
# wire that to wherever the owner actually watches (a follow-up, not yet done).

on:
  schedule:
    # 07:00 UTC daily (~midnight US Pacific). Cron runs on the default branch only.
    - cron: "0 7 * * *"
  # Manual trigger for on-demand deep/perf runs from any branch; `jobs`
  # picks one job (go-shapes: the Go shape suite alone, which is how its
  # baseline is regenerated on a branch; go-race-nightly: the unsharded amd64
  # race run alone; go-xos-macos: the macOS default tier alone).
  workflow_dispatch:
    inputs:
      jobs:
        description: "Jobs to run: all, deep-and-perf, osv-scan, go-race-nightly, go-xos-macos or go-shapes"
        required: false
        default: all

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deep-and-perf:
    if: github.event_name == 'schedule' || inputs.jobs == 'all' || inputs.jobs == 'deep-and-perf'
    runs-on: ubuntu-latest
    # The perf tier (1M-key SORT-PERF, 100k PERF-1/2) is the long pole; deep is ~minutes.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v6.4.0

      # Deep tier serially (-PtestMaxParallelForks=1) so probe budgets are asserted without
      # cross-fork CPU contention, exactly as the main-merge deep-tests job runs them.
      - name: Deep tier (serial)
        run: ./gradlew test -Pdeep -PtestMaxParallelForks=1 --no-daemon --stacktrace

      # What this job is FOR is re-executing the tier, so the count is the result that
      # matters: a tag filter that matches nothing, or a reused task result, would otherwise
      # report green in 2 minutes. See the script header.
      - name: Deep tier executed tests
        run: ./scripts/ci/report-test-counts.sh "deep tier"

      # The real `kill -9` -> `--resume` exactly-once path -- see ci.yml's
      # deep-tests job for the same step (this one is the schedule-driven backstop, matching
      # the deep tier's own "runs on every main-merge (ci.yml) + nightly" pattern above).
      - name: Real kill -9 -> --resume exactly-once
        run: ./gradlew :swath-cli:test --tests "io.varve.swath.cli.HardCrashSigkillResumeProcessIT" -Dswath.it.sigkill=true --no-daemon --stacktrace

      - name: Kill -9 IT executed tests
        run: ./scripts/ci/report-test-counts.sh "kill -9 exactly-once IT" swath-cli

      # Parametric external-kill matrix (schedule-driven backstop, mirrors ci.yml's deep-tests).
      - name: Real kill -9 matrix -> --resume identical-to-clean
        run: ./gradlew :swath-cli:test --tests "io.varve.swath.cli.HardCrashSigkillResumeMatrixIT" -Dswath.it.sigkill=true --no-daemon --stacktrace

      - name: Kill -9 matrix executed tests
        run: ./scripts/ci/report-test-counts.sh "kill -9 matrix IT" swath-cli

      # Perf tier ONLY (-PonlyPerf runs just the @Tag("perf") classes — not the whole fast+
      # integration suite — and the convention plugin bumps the test-worker heap to 2g for the
      # GB-scale memory corridors these assert against). No DuckDB needed: the perf classes are
      # mock-driven (the DuckDB-backed INT-6 is an integration test, not perf).
      - name: Perf tier
        run: ./gradlew test -PonlyPerf --no-daemon --stacktrace

      - name: Perf tier executed tests
        run: ./scripts/ci/report-test-counts.sh "perf tier"

      # TODO: add a gated real-AWS public-bucket differential
      # (`aws s3api --no-sign-request` vs swath) once the public-bucket harness lands — the
      # independent-implementation wire-fidelity anchor that supersedes LocalStack.

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: test-reports-nightly
          path: "*/build/reports/tests/"
          if-no-files-found: ignore

  # Supply-chain scan of the artifacts a user actually receives: the resolved jar closure of
  # each application distribution, and the runtime image whose JRE base carries OS packages no
  # Gradle constraint can reach. Nightly rather than per-commit because it is time, not the
  # commit, that turns a green closure red — an advisory published against a dependency that
  # has not moved. That is also why it belongs beside the deep tier: both are backstops
  # against drift the per-commit gate cannot see.
  #
  # config/osv/osv-scanner.toml carries only the argued Java exceptions, each with an expiry.
  # The checked-in image policy fails every unexpected non-Ubuntu advisory and Ubuntu
  # high/critical/unknown priority while reporting lower Canonical priorities. See
  # scripts/ci/osv-scan.sh and scripts/ci/osv-image-policy.py.
  osv-scan:
    if: github.event_name == 'schedule' || inputs.jobs == 'all' || inputs.jobs == 'osv-scan'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v6.4.0

      # installDist, not the shadow jar: the install `lib/` directory is the resolved closure
      # with each module still a separately identifiable artifact, which is what the scanner
      # reads. Shading flattens that into one jar and loses the coordinates.
      - name: Assemble the shipped distributions
        run: ./gradlew :swath-cli:installDist :swath-replay:installDist --no-daemon --stacktrace

      - name: Scan the shipped jar closures
        run: |
          ./scripts/ci/osv-scan.sh \
            swath-cli/build/install/swath/lib \
            swath-replay/build/install/swath-replay/lib

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # Builder-native arch only, and no push: this scans the base layer's OS packages, which
      # are the same image for both arches' JRE bases in every way this scan looks at.
      - name: Build the runtime images (builder-native arch)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          load: true
          tags: swath:osv
          cache-from: type=gha,scope=swath

      - name: Build the replay runtime image (builder-native arch)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile.replay
          load: true
          tags: swath-replay:osv
          cache-from: type=gha,scope=swath-replay

      - name: Scan the runtime images
        env:
          OSV_REPORT_DIR: build/reports/osv
        run: ./scripts/ci/osv-scan.sh image:swath:osv image:swath-replay:osv

      - name: Upload raw OSV image reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: osv-image-reports
          path: build/reports/osv/*.json
          if-no-files-found: ignore

  # The Go race tests in one unsharded run on amd64. Per push, ci.yml races internal/listing and
  # cmd/swath on arm64 only (go-race, scripts/ci/go-race-shards.sh): this is their amd64 race
  # coverage, and a check that the shards' union still equals `go test -race ./...`. The -json
  # stream is kept as an artifact for flakes and per-test times.
  go-race-nightly:
    if: github.event_name == 'schedule' || inputs.jobs == 'all' || inputs.jobs == 'go-race-nightly'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - name: Set up Go (version from go/go.mod)
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      # -timeout is per package binary and leaves the job's limit room for the packages queued
      # ahead of the last (the unsharded run took ~13 min), so a hang ends in a goroutine dump.
      - name: go test -race ./... (unsharded, amd64)
        run: |
          set -euo pipefail
          json="$RUNNER_TEMP/go-race-nightly.json"
          set +e
          go test -race -count=1 -timeout 40m -json ./... | tee "$json" |
            jq --unbuffered -rj 'select(.Action == "output" and .Test == null) | .Output'
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::group::output of the failed tests"
            jq -rjs '(map(select(.Action == "fail" and .Test != null) | [.Package, .Test]) | unique) as $failed
              | .[] | select(.Action == "output" and .Test != null and ([.Package, .Test] as $k | $failed | index([$k])))
              | .Output' "$json"
            echo "::endgroup::"
          fi
          exit "$status"

      - name: Upload the go test -json stream
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: go-race-nightly
          path: ${{ runner.temp }}/go-race-nightly.json
          if-no-files-found: ignore

  # The Go default tier on macOS, as ci.yml go-xos runs it: vet and the whole suite without
  # -race. ci.yml runs it on main and dispatch but not on pull requests, so a macOS-only break in
  # a pull request shows on its merge to main at the latest; this run is the scheduled backstop.
  go-xos-macos:
    if: github.event_name == 'schedule' || inputs.jobs == 'all' || inputs.jobs == 'go-xos-macos'
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - name: Set up Go (version from go/go.mod)
        uses: ./.github/actions/setup-go
        with:
          key: go-xos

      - name: go vet
        run: go vet ./...

      - name: go test (no -race)
        run: go test -count=1 -timeout 25m ./...

  # The Go port's shape suite at full scale (go/bench/shapes; go/docs/testing.md): every bucket
  # shape at about 2M keys behind the in-process fake, with its service behaviours (latency
  # 10/50/200 ms, jitter, 1 % and 5 % throttling, a rate cap, slow prefixes, slow continuations
  # and seeks, a slow first page). A wrong listing fails the job. A number that moved by more
  # than 20 % against the committed baseline (go/bench/baselines/shapes.json) is annotated, not
  # failed, until the baselines have held steady for about two weeks.
  go-shapes:
    if: github.event_name == 'schedule' || inputs.jobs == 'all' || inputs.jobs == 'go-shapes'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - name: Set up Go (version from go/go.mod)
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Shape suite against the baseline
        run: go run ./bench/shapes -out "$RUNNER_TEMP/shapes.json" -scratch "$RUNNER_TEMP/shapes" -baseline bench/baselines/shapes.json

      - name: Upload the shape summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: go-shapes-summary
          path: ${{ runner.temp }}/shapes.json
          if-no-files-found: ignore
