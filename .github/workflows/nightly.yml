name: Nightly deep verification

# What the per-commit gate cannot see, checked on a schedule: the tests too slow or too
# timing-sensitive to run per commit, and the supply-chain scan, which goes red because time
# passed rather than because the commit changed.
#
# go-race-nightly is the Go port's backstop: the race tests unsharded on amd64. go-xos-macos
# and go-xos-windows run the Go default tier on macOS and Windows, which ci.yml runs on main
# and dispatch but not on pull requests.
#
# ALERTING: a failure here means an invariant broke outside the per-commit gate — GitHub
# emails the default recipients on a failed scheduled run; wire that to wherever the owner
# actually watches (a follow-up, not yet done).

on:
  schedule:
    # 07:00 UTC daily (~midnight US Pacific). Cron runs on the default branch only.
    - cron: "0 7 * * *"
  # Manual trigger for on-demand runs from any branch; `jobs`
  # picks one job (go-shapes: the Go shape suite alone, which is how its
  # baseline is regenerated on a branch; go-race-nightly: the unsharded amd64
  # race run alone; go-xos-macos: the macOS default tier alone).
  workflow_dispatch:
    inputs:
      jobs:
        description: "Jobs to run: all, osv-scan, go-race-nightly, go-xos-macos, go-xos-windows or go-shapes"
        required: false
        default: all

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Supply-chain scan of the artifacts a user actually receives: the two release images, built
  # from the Dockerfile. osv-scanner reads the Go version and module list embedded in each static
  # binary, so this covers the Go standard library and every module linked into swath and
  # swath-replay (the archives carry the same binaries), plus the few Debian packages of the
  # lister's distroless base; the replay image is `scratch` and holds only its binary. Nightly
  # rather than per-commit because it is time, not the commit, that turns a green image red: an
  # advisory published against a module that has not moved.
  #
  # The checked-in image policy fails every advisory that is neither an Ubuntu package's
  # (the images have none) nor an argued exception in config/osv/osv-scanner.toml. See
  # scripts/ci/osv-scan.sh and scripts/ci/osv-image-policy.py.
  osv-scan:
    if: github.event_name == 'schedule' || inputs.jobs == 'all' || inputs.jobs == 'osv-scan'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # Builder-native arch only, and no push: both architectures link the same modules, and the
      # lister's base carries the same packages for each.
      - name: Build the lister image (builder-native arch)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile
          target: swath
          load: true
          tags: swath:osv
          cache-from: type=gha,scope=swath-go

      - name: Build the replay image (builder-native arch)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile
          target: swath-replay
          load: true
          tags: swath-replay:osv
          cache-from: type=gha,scope=swath-go

      - name: Scan the runtime images
        env:
          OSV_REPORT_DIR: build/reports/osv
        run: ./scripts/ci/osv-scan.sh image:swath:osv image:swath-replay:osv

      - name: Upload raw OSV image reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: osv-image-reports
          path: build/reports/osv/*.json
          if-no-files-found: ignore
          retention-days: 30

  # The Go race tests in one unsharded run on amd64. Per push, ci.yml races internal/listing and
  # cmd/swath on arm64 only (go-race, scripts/ci/go-race-shards.sh): this is their amd64 race
  # coverage, and a check that the shards' union still equals `go test -race ./...`. The -json
  # stream is kept as an artifact for flakes and per-test times.
  go-race-nightly:
    if: github.event_name == 'schedule' || inputs.jobs == 'all' || inputs.jobs == 'go-race-nightly'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Restores the shared module cache and ci.yml's amd64 race build cache (go-race-rest); saves
      # nothing off a push to main.
      - name: Set up Go (version from go.mod)
        uses: ./.github/actions/setup-go
        with:
          key: go-race-rest

      # -timeout is per package binary and leaves the job's limit room for the packages queued
      # ahead of the last (the unsharded run took ~13 min), so a hang ends in a goroutine dump.
      - name: go test -race ./... (unsharded, amd64)
        run: |
          set -euo pipefail
          json="$RUNNER_TEMP/go-race-nightly.json"
          set +e
          go test -race -count=1 -timeout 40m -json ./... | tee "$json" |
            jq --unbuffered -rj 'select(.Action == "output" and .Test == null) | .Output'
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::group::output of the failed tests"
            jq -rjs '(map(select(.Action == "fail" and .Test != null) | [.Package, .Test]) | unique) as $failed
              | .[] | select(.Action == "output" and .Test != null and ([.Package, .Test] as $k | $failed | index([$k])))
              | .Output' "$json"
            echo "::endgroup::"
          fi
          exit "$status"

      - name: Upload the go test -json stream
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: go-race-nightly
          path: ${{ runner.temp }}/go-race-nightly.json
          if-no-files-found: ignore
          retention-days: 30

  # The Go default tier on macOS, as ci.yml go-xos runs it: vet and the whole suite without
  # -race. ci.yml runs it on main and dispatch but not on pull requests, so a macOS-only break in
  # a pull request shows on its merge to main at the latest; this run is the scheduled backstop.
  go-xos-macos:
    if: github.event_name == 'schedule' || inputs.jobs == 'all' || inputs.jobs == 'go-xos-macos'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Restores the shared module cache and ci.yml's macOS build cache (go-xos); saves nothing
      # off a push to main.
      - name: Set up Go (version from go.mod)
        uses: ./.github/actions/setup-go
        with:
          key: go-xos

      - name: go vet
        run: go vet ./...

      - name: go test (no -race)
        run: go test -count=1 -timeout 25m ./...

  # The Go default tier on Windows, as ci.yml go-xos runs it: vet and the whole suite without
  # -race. ci.yml runs it on main and dispatch but not on pull requests, so a Windows-only break in
  # a pull request shows on its merge to main at the latest; this run is the scheduled backstop.
  go-xos-windows:
    if: github.event_name == 'schedule' || inputs.jobs == 'all' || inputs.jobs == 'go-xos-windows'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Restores the shared module cache and ci.yml's Windows build cache (go-xos); saves nothing
      # off a push to main.
      - name: Set up Go (version from go.mod)
        uses: ./.github/actions/setup-go
        with:
          key: go-xos

      - name: go vet
        run: go vet ./...

      - name: go test (no -race)
        run: go test -count=1 -timeout 25m ./...

  # The Go port's shape suite at full scale (bench/shapes; docs/internals/testing.md): every bucket
  # shape at about 2M keys behind the in-process fake, with its service behaviours (latency
  # 10/50/200 ms, jitter, 1 % and 5 % throttling, a rate cap, slow prefixes, slow continuations
  # and seeks, a slow first page). A wrong listing fails the job. A number that moved by more
  # than 20 % against the committed baseline (bench/baselines/shapes.json) is annotated, not
  # failed, until the baselines have held steady for about two weeks.
  go-shapes:
    if: github.event_name == 'schedule' || inputs.jobs == 'all' || inputs.jobs == 'go-shapes'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Restores the shared module cache and ci.yml's non-race build cache (go-nonrace); saves
      # nothing off a push to main.
      - name: Set up Go (version from go.mod)
        uses: ./.github/actions/setup-go
        with:
          key: go-nonrace

      - name: Shape suite against the baseline
        run: go run ./bench/shapes -out "$RUNNER_TEMP/shapes.json" -scratch "$RUNNER_TEMP/shapes" -baseline bench/baselines/shapes.json

      - name: Upload the shape summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: go-shapes-summary
          path: ${{ runner.temp }}/shapes.json
          if-no-files-found: ignore
          retention-days: 30
