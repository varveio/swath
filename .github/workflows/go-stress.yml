name: Go stress

# On-demand repetition of one Go test (or a regex of tests) to hunt flakes on a chosen OS and
# scheduler width, e.g.
#   gh workflow run go-stress.yml --ref <branch> -f package=./internal/listing -f run='^TestX$'
# The dispatch ref is the code under test. Inputs reach the shell only through env, never
# through ${{ inputs.* }} in a run script, so a crafted regex cannot inject commands.

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package pattern relative to the repository root (e.g. ./internal/listing)
        required: true
        default: ./...
      run:
        description: Test regex passed to -run
        required: true
      count:
        description: Repetitions (-count)
        required: true
        default: "50"
      race:
        description: Race detector (ignored on windows)
        type: boolean
        default: true
      gomaxprocs:
        description: GOMAXPROCS (empty = unset)
        required: false
        default: ""
      cpu:
        description: GOMAXPROCS list passed to -cpu (e.g. 1,2,4; empty = not passed)
        required: false
        default: ""
      shuffle:
        description: Shuffle test order (-shuffle=on; the seed is printed)
        type: boolean
        default: false
      os:
        description: Runner
        type: choice
        default: ubuntu-latest
        options: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]

permissions:
  contents: read

jobs:
  stress:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The ci.yml setup, restored and never saved: the shared module cache, which every runner
      # has, and the build cache of the ci.yml job on the same runner (go-race (rest) on amd64,
      # go-race (listing-rest) on arm64, go-xos on macOS and Windows; go-xos builds without -race).
      - name: Set up Go (version from go.mod)
        uses: ./.github/actions/setup-go
        with:
          key: ${{ inputs.os == 'ubuntu-latest' && 'go-race-rest' || inputs.os == 'ubuntu-24.04-arm' && 'go-race-listing-rest' || 'go-xos' }}

      - name: go test (repeated)
        env:
          PKG: ${{ inputs.package }}
          RUN: ${{ inputs.run }}
          COUNT: ${{ inputs.count }}
          RACE: ${{ inputs.race }}
          MAXPROCS: ${{ inputs.gomaxprocs }}
          CPU: ${{ inputs.cpu }}
          SHUFFLE: ${{ inputs.shuffle }}
          RUNNER_OS_NAME: ${{ runner.os }}
        run: |
          set -uo pipefail
          args=(-run "$RUN" -count "$COUNT" -timeout 60m -json)
          # The race detector needs cgo, which the Windows runner lacks by default.
          if [ "$RACE" = true ] && [ "$RUNNER_OS_NAME" != Windows ]; then args+=(-race); fi
          if [ -n "$CPU" ]; then args+=(-cpu "$CPU"); fi
          if [ "$SHUFFLE" = true ]; then args+=(-shuffle=on); fi
          if [ -n "$MAXPROCS" ]; then export GOMAXPROCS="$MAXPROCS"; fi
          go test "${args[@]}" "$PKG" | tee "$RUNNER_TEMP/go-stress.json" >/dev/null
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_ENV"

      - name: Summary
        if: always()
        env:
          RUN: ${{ inputs.run }}
          COUNT: ${{ inputs.count }}
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/go-stress.json"
          [ -f "$f" ] || { echo "no test output" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          # Count test-level (not package-level) outcomes.
          pass=$(jq -c 'select(.Test != null and .Action == "pass")' "$f" | wc -l)
          fail=$(jq -c 'select(.Test != null and .Action == "fail")' "$f" | wc -l)
          {
            echo "### Go stress"
            echo
            echo "run \`$RUN\` x $COUNT on $RUNNER_OS: **$pass passed, $fail failed**"
            echo
            jq -r 'select(.Test != null and .Action == "fail") | .Test' "$f" | sort | uniq -c | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test JSON
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: go-stress-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/go-stress.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Fail if any test failed
        run: exit "${status:-1}"
